<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Мафия: Большой Город</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg-dark: #1a1a1a;
    --bg-card: #2a2a2a;
    --bg-lighter: #333;
    --bg-hover: #3a3a3a;
    --text-primary: #e0e0e0;
    --text-secondary: #999;
    --red: #E53935;
    --red-dark: #b71c1c;
    --blue: #1E88E5;
    --yellow: #FDD835;
    --green: #43A047;
    --border: #444;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
}

.screen {
    display: none;
    padding: 12px;
    padding-bottom: 80px;
}

.screen.active {
    display: block;
}

h1 {
    text-align: center;
    font-size: 22px;
    padding: 12px 0;
    color: var(--red);
    text-transform: uppercase;
    letter-spacing: 2px;
}

h2 {
    font-size: 16px;
    padding: 8px 0;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Buttons */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    color: #fff;
}

.btn:active {
    transform: scale(0.96);
}

.btn-red {
    background: var(--red);
}

.btn-red:hover {
    background: var(--red-dark);
}

.btn-dark {
    background: var(--bg-lighter);
    color: var(--text-primary);
}

.btn-green {
    background: var(--green);
}

.btn-full {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    margin-top: 10px;
}

.btn-sm {
    padding: 6px 12px;
    font-size: 13px;
}

/* Player selection grid */
.player-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin: 8px 0;
}

.player-check {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg-card);
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
    user-select: none;
}

.player-check.checked {
    border-color: var(--red);
    background: #3a2020;
}

.player-check .checkbox {
    width: 22px;
    height: 22px;
    border: 2px solid var(--border);
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    transition: all 0.15s;
}

.player-check.checked .checkbox {
    background: var(--red);
    border-color: var(--red);
}

.player-check .name {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Select all bar */
.select-bar {
    display: flex;
    gap: 8px;
    margin: 8px 0;
}

.select-bar .btn {
    flex: 1;
}

/* Game screen */
.turn-order-bar {
    display: flex;
    gap: 4px;
    padding: 8px;
    overflow-x: auto;
    background: var(--bg-card);
    border-radius: 10px;
    margin-bottom: 10px;
    -webkit-overflow-scrolling: touch;
}

.turn-order-bar::-webkit-scrollbar {
    height: 3px;
}

.turn-order-bar::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
}

.turn-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 8px;
    border-radius: 8px;
    background: var(--bg-lighter);
    flex-shrink: 0;
    font-size: 11px;
    min-width: 52px;
    text-align: center;
    border: 1px solid var(--border);
}

.turn-chip .emoji {
    font-size: 18px;
}

.turn-chip .tname {
    font-size: 9px;
    margin-top: 2px;
    white-space: nowrap;
}

.turn-chip .pname {
    font-size: 9px;
    color: var(--text-secondary);
    white-space: nowrap;
    max-width: 56px;
    overflow: hidden;
    text-overflow: ellipsis;
}

.turn-chip.dead {
    opacity: 0.3;
}

/* Player list in game */
.game-player-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
}

.game-player {
    display: flex;
    align-items: center;
    padding: 8px 10px;
    background: var(--bg-card);
    border-radius: 8px;
    position: relative;
    gap: 6px;
    transition: all 0.2s;
    border-left: 3px solid var(--border);
}

.game-player.role-town {
    border-left-color: var(--blue);
}

.game-player.role-crime {
    border-left-color: var(--red);
}

.game-player.role-rogue {
    border-left-color: var(--yellow);
}

.game-player .info {
    flex: 1;
    min-width: 0;
    cursor: pointer;
}

.game-player .p-name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.game-player .p-role {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.game-player .p-role.town { color: var(--blue); }
.game-player .p-role.crime { color: var(--red); }
.game-player .p-role.rogue { color: var(--yellow); }

.game-player .p-name.town { color: var(--blue); }
.game-player .p-name.crime { color: var(--red); }
.game-player .p-name.rogue { color: var(--yellow); }

.kill-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--red);
    background: transparent;
    color: var(--red);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
}

.kill-btn:active {
    background: var(--red);
    color: #fff;
}

.game-player.dead {
    opacity: 0.5;
    order: 999;
}

.game-player.dead::after {
    content: '✕';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 36px;
    color: rgba(229, 57, 53, 0.5);
    pointer-events: none;
    font-weight: bold;
}

.game-player.dead .kill-btn {
    border-color: var(--green);
    color: var(--green);
}

/* Role picker modal */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    justify-content: center;
    align-items: flex-end;
}

.modal-overlay.active {
    display: flex;
}

.modal {
    background: var(--bg-dark);
    width: 100%;
    max-height: 85vh;
    border-radius: 16px 16px 0 0;
    padding: 16px;
    overflow-y: auto;
}

.modal-title {
    text-align: center;
    font-size: 16px;
    margin-bottom: 12px;
    color: var(--text-primary);
}

.modal-section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 0;
    margin-top: 4px;
}

.modal-section-title.town { color: var(--blue); }
.modal-section-title.crime { color: var(--red); }
.modal-section-title.rogue { color: var(--yellow); }

.role-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 5px;
    margin-bottom: 6px;
}

.role-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 4px;
    background: var(--bg-card);
    border: 2px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    font-size: 11px;
    text-align: center;
    transition: all 0.1s;
    color: var(--text-primary);
}

.role-btn .remoji {
    font-size: 22px;
    margin-bottom: 2px;
}

.role-btn:active {
    transform: scale(0.95);
}

.role-btn.town { border-color: rgba(30,136,229,0.3); }
.role-btn.crime { border-color: rgba(229,57,53,0.3); }
.role-btn.rogue { border-color: rgba(253,216,53,0.3); }

.role-btn.town:active { background: rgba(30,136,229,0.2); }
.role-btn.crime:active { background: rgba(229,57,53,0.2); }
.role-btn.rogue:active { background: rgba(253,216,53,0.2); }

.clear-role-btn {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    background: var(--bg-lighter);
    border: none;
    border-radius: 8px;
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
}

.modal-close {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    background: var(--red-dark);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

/* Bottom nav */
.bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    display: flex;
    background: var(--bg-card);
    border-top: 1px solid var(--border);
    z-index: 100;
}

.bottom-bar .tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: color 0.15s;
    border: none;
    background: transparent;
}

.bottom-bar .tab.active {
    color: var(--red);
}

.bottom-bar .tab .tab-icon {
    font-size: 20px;
    display: block;
    margin-bottom: 2px;
}

/* End game overlay */
.end-bar {
    display: flex;
    gap: 8px;
    margin: 10px 0;
}

.end-bar .btn {
    flex: 1;
}

.counter-bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

.counter-chip {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
}

.counter-chip.town { background: rgba(30,136,229,0.2); color: var(--blue); }
.counter-chip.crime { background: rgba(229,57,53,0.2); color: var(--red); }
.counter-chip.rogue { background: rgba(253,216,53,0.2); color: var(--yellow); }
.counter-chip.total { background: rgba(255,255,255,0.1); color: var(--text-primary); }

/* No role tag */
.no-role {
    color: var(--text-secondary);
    font-style: italic;
}

.turn-label {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
</style>
</head>
<body>

<!-- SCREEN 1: Player Selection -->
<div class="screen active" id="screen-setup">
    <h1>🔫 Мафия</h1>
    <h2>Выбери игроков</h2>
    <div class="select-bar">
        <button class="btn btn-dark btn-sm" onclick="selectAll()">Выбрать всех</button>
        <button class="btn btn-dark btn-sm" onclick="deselectAll()">Снять все</button>
    </div>
    <div class="player-grid" id="player-grid"></div>
    <button class="btn btn-red btn-full" onclick="startGame()">🎮 Начать игру</button>
</div>

<!-- SCREEN 2: Game -->
<div class="screen" id="screen-game">
    <h1>🌙 Игра</h1>

    <div class="turn-label">Порядок ходов ночью:</div>
    <div class="turn-order-bar" id="turn-order-bar"></div>

    <div class="counter-bar" id="counter-bar"></div>

    <div class="game-player-list" id="game-player-list"></div>

    <div class="end-bar">
        <button class="btn btn-dark btn-full" onclick="endGame()">🔄 Новая игра</button>
    </div>
</div>

<!-- Role picker modal -->
<div class="modal-overlay" id="role-modal">
    <div class="modal">
        <div class="modal-title" id="modal-title">Роль для: Игрок</div>

        <div class="modal-section-title town">👥 Горожане</div>
        <div class="role-grid" id="roles-town"></div>

        <div class="modal-section-title crime">🔪 Преступники</div>
        <div class="role-grid" id="roles-crime"></div>

        <div class="modal-section-title rogue">⚡ Отщепенцы</div>
        <div class="role-grid" id="roles-rogue"></div>

        <button class="clear-role-btn" onclick="assignRole(null)">❌ Убрать роль</button>
        <button class="modal-close" onclick="closeModal()">Закрыть</button>
    </div>
</div>

<!-- Bottom bar -->
<div class="bottom-bar" id="bottom-bar" style="display:none;">
    <button class="tab active" onclick="showScreen('screen-game')">
        <span class="tab-icon">🎮</span>Игра
    </button>
    <button class="tab" onclick="showScreen('screen-setup')">
        <span class="tab-icon">👥</span>Лобби
    </button>
</div>

<script>
// ============================================================
// 📋 СПИСОК ИГРОКОВ — МЕНЯЙ ЗДЕСЬ!
// ============================================================
const ALL_PLAYERS = [
    "Димон", "Вова", "Вадим", "Катя", "Влад", "Рома", "Маша", "Инна", "Рябчун", "Виталик", "Стас", "Мотвей", "Надя", "Полина", "Соня", "Оля", "Лена", "Тёма"
];
// ============================================================

// Roles data: [id, name, emoji, faction, turnOrder (null=no night action)]
// Turn order: Адвокат(1) → Доктор(2) → Телохранитель(3) → Мафия(4) → Картель(5)
// → Отщепенцы(6) → Любовница(7) → Детектив/Патрульный(8) → Журналист(9)
// → Экстрасенс(10) → Ищейка(11) → Сыщик(12) → Судья(13) → Поклонница(14)
const ROLES = [
    // Горожане
    { id: "civil",       name: "Мирный",       emoji: "🏠", faction: "town",  order: null },
    { id: "agent",       name: "Агент",        emoji: "🕵️", faction: "town",  order: 4 },
    { id: "judge",       name: "Судья",        emoji: "⚖️", faction: "town",  order: 13 },
    { id: "detective",   name: "Детектив",     emoji: "🔍", faction: "town",  order: 8 },
    { id: "journalist",  name: "Журналист",    emoji: "📰", faction: "town",  order: 9 },
    { id: "doctor",      name: "Доктор",       emoji: "💉", faction: "town",  order: 2 },
    { id: "bodyguard",   name: "Телохранитель",emoji: "🛡️", faction: "town",  order: 3 },
    { id: "patrol",      name: "Патрульный",   emoji: "🚔", faction: "town",  order: 8 },
    { id: "psychic",     name: "Экстрасенс",  emoji: "🔮", faction: "town",  order: 10 },
    { id: "fangirl",     name: "Поклонница",   emoji: "💋", faction: "town",  order: 14 },
    { id: "sleuth",      name: "Сыщик",        emoji: "🧐", faction: "town",  order: 12 },
    { id: "lucky",       name: "Везунчик",     emoji: "🍀", faction: "town",  order: null },
    { id: "avenger",     name: "Мститель",     emoji: "💀", faction: "town",  order: null },

    // Преступники
    { id: "mafia",       name: "Мафия",        emoji: "🔫", faction: "crime", order: 4 },
    { id: "cartel",      name: "Картель",      emoji: "💣", faction: "crime", order: 5 },
    { id: "lawyer",      name: "Адвокат",      emoji: "📜", faction: "crime", order: 1 },
    { id: "mistress",    name: "Любовница",    emoji: "❤️‍🔥",faction: "crime", order: 7 },
    { id: "tracker",     name: "Ищейка",       emoji: "🐕", faction: "crime", order: 11 },
    { id: "werewolf",    name: "Оборотень",    emoji: "🐺", faction: "crime", order: 4 },
    { id: "boss",        name: "Босс",         emoji: "👔", faction: "crime", order: 4 },
    { id: "kingpin",     name: "Главарь",      emoji: "🎩", faction: "crime", order: 5 },

    // Отщепенцы
    { id: "maniac",      name: "Маньяк",       emoji: "🪓", faction: "rogue", order: 6 },
    { id: "poisoner",    name: "Отравитель",   emoji: "☠️", faction: "rogue", order: 6 },
    { id: "sectant",     name: "Сектант",      emoji: "🕯️", faction: "rogue", order: 6 },
    { id: "revolutionary",name: "Революционер",emoji: "✊", faction: "rogue", order: 6 },
];

let selectedPlayers = new Set();
let gamePlayers = []; // [{name, role: null|roleObj, dead: false}]
let currentModalPlayer = null;

// Init
function init() {
    renderPlayerGrid();
}

function renderPlayerGrid() {
    const grid = document.getElementById('player-grid');
    grid.innerHTML = ALL_PLAYERS.map(name => `
        <div class="player-check ${selectedPlayers.has(name)?'checked':''}" onclick="togglePlayer('${name}', this)">
            <div class="checkbox">${selectedPlayers.has(name)?'✓':''}</div>
            <div class="name">${name}</div>
        </div>
    `).join('');
}

function togglePlayer(name, el) {
    if (selectedPlayers.has(name)) {
        selectedPlayers.delete(name);
    } else {
        selectedPlayers.add(name);
    }
    renderPlayerGrid();
}

function selectAll() {
    ALL_PLAYERS.forEach(n => selectedPlayers.add(n));
    renderPlayerGrid();
}

function deselectAll() {
    selectedPlayers.clear();
    renderPlayerGrid();
}

function startGame() {
    if (selectedPlayers.size < 2) {
        alert("Выбери хотя бы 2 игроков!");
        return;
    }
    gamePlayers = Array.from(selectedPlayers).map(name => ({
        name,
        role: null,
        dead: false
    }));
    document.getElementById('bottom-bar').style.display = 'flex';
    showScreen('screen-game');
    renderGame();
}

function endGame() {
    if (!confirm("Завершить игру и начать новую?")) return;
    gamePlayers = [];
    document.getElementById('bottom-bar').style.display = 'none';
    showScreen('screen-setup');
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.querySelectorAll('.bottom-bar .tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && id === 'screen-game') || (i === 1 && id === 'screen-setup'));
    });
    if (id === 'screen-game') renderGame();
}

function renderGame() {
    renderTurnOrder();
    renderCounters();
    renderGamePlayers();
}

function renderTurnOrder() {
    const bar = document.getElementById('turn-order-bar');
    // Collect players that have a role with a turn order
    let entries = [];
    gamePlayers.forEach(gp => {
        if (gp.role && gp.role.order !== null) {
            entries.push({
                order: gp.role.order,
                emoji: gp.role.emoji,
                roleName: gp.role.name,
                playerName: gp.name,
                dead: gp.dead,
                faction: gp.role.faction
            });
        }
    });
    entries.sort((a, b) => a.order - b.order);

    if (entries.length === 0) {
        bar.innerHTML = '<div style="padding:8px;color:var(--text-secondary);font-size:12px;">Назначь роли, чтобы увидеть порядок ходов</div>';
        return;
    }

    bar.innerHTML = entries.map(e => {
        const colorClass = e.faction;
        const nameColor = e.faction === 'town' ? 'var(--blue)' : e.faction === 'crime' ? 'var(--red)' : 'var(--yellow)';
        return `
        <div class="turn-chip ${e.dead?'dead':''}" style="border-color:${nameColor}40;">
            <span class="emoji">${e.emoji}</span>
            <span class="tname" style="color:${nameColor}">${e.roleName}</span>
            <span class="pname">${e.playerName}</span>
        </div>`;
    }).join('');
}

function renderCounters() {
    const bar = document.getElementById('counter-bar');
    let alive = gamePlayers.filter(p => !p.dead);
    let town = alive.filter(p => p.role && p.role.faction === 'town').length;
    let crime = alive.filter(p => p.role && p.role.faction === 'crime').length;
    let rogue = alive.filter(p => p.role && p.role.faction === 'rogue').length;
    let noRole = alive.filter(p => !p.role).length;
    let total = alive.length;

    bar.innerHTML = `
        <span class="counter-chip total">Живых: ${total}</span>
        <span class="counter-chip town">🔵 ${town}</span>
        <span class="counter-chip crime">🔴 ${crime}</span>
        <span class="counter-chip rogue">🟡 ${rogue}</span>
        ${noRole > 0 ? `<span class="counter-chip total">❓ ${noRole}</span>` : ''}
    `;
}

function renderGamePlayers() {
    const list = document.getElementById('game-player-list');
    // Sort: alive first, dead last
    let sorted = [...gamePlayers].sort((a, b) => {
        if (a.dead && !b.dead) return 1;
        if (!a.dead && b.dead) return -1;
        return 0;
    });

    list.innerHTML = sorted.map((gp, _) => {
        let idx = gamePlayers.indexOf(gp);
        let factionClass = gp.role ? `role-${gp.role.faction}` : '';
        let nameClass = gp.role ? gp.role.faction : '';
        let roleClass = gp.role ? gp.role.faction : '';
        let roleText = gp.role ? `${gp.role.emoji} ${gp.role.name}` : '—';
        let deadClass = gp.dead ? 'dead' : '';

        return `
        <div class="game-player ${factionClass} ${deadClass}">
            <div class="info" onclick="openRoleModal(${idx})">
                <div class="p-name ${nameClass}">${gp.name}</div>
                <div class="p-role ${roleClass} ${!gp.role?'no-role':''}">${roleText}</div>
            </div>
            <button class="kill-btn" onclick="toggleDead(${idx})" title="${gp.dead?'Восстановить':'Убить'}">
                ${gp.dead ? '↩' : '✕'}
            </button>
        </div>`;
    }).join('');
}

function toggleDead(idx) {
    gamePlayers[idx].dead = !gamePlayers[idx].dead;
    renderGame();
}

// Role modal
function openRoleModal(idx) {
    currentModalPlayer = idx;
    const gp = gamePlayers[idx];
    document.getElementById('modal-title').textContent = `Роль: ${gp.name}`;

    const townRoles = ROLES.filter(r => r.faction === 'town');
    const crimeRoles = ROLES.filter(r => r.faction === 'crime');
    const rogueRoles = ROLES.filter(r => r.faction === 'rogue');

    document.getElementById('roles-town').innerHTML = townRoles.map(r => roleBtn(r)).join('');
    document.getElementById('roles-crime').innerHTML = crimeRoles.map(r => roleBtn(r)).join('');
    document.getElementById('roles-rogue').innerHTML = rogueRoles.map(r => roleBtn(r)).join('');

    document.getElementById('role-modal').classList.add('active');
}

function roleBtn(r) {
    const orderLabel = r.order !== null ? `#${r.order}` : '';
    return `
    <div class="role-btn ${r.faction}" onclick="assignRole('${r.id}')">
        <span class="remoji">${r.emoji}</span>
        <span>${r.name}</span>
        ${orderLabel ? `<span style="font-size:9px;color:var(--text-secondary)">${orderLabel}</span>` : ''}
    </div>`;
}

function assignRole(roleId) {
    if (currentModalPlayer === null) return;
    if (roleId === null) {
        gamePlayers[currentModalPlayer].role = null;
    } else {
        const role = ROLES.find(r => r.id === roleId);
        gamePlayers[currentModalPlayer].role = { ...role };
    }
    closeModal();
    renderGame();
}

function closeModal() {
    document.getElementById('role-modal').classList.remove('active');
    currentModalPlayer = null;
}

// Close modal on overlay click
document.getElementById('role-modal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

init();
</script>
</body>
</html>
