<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Мафия: Большой Город</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg-dark: #1a1a1a;
    --bg-card: #2a2a2a;
    --bg-input: #333;
    --text: #e0e0e0;
    --text-dim: #888;
    --red: #E53935;
    --red-dark: #b71c1c;
    --blue: #1E88E5;
    --yellow: #FDD835;
    --green: #43A047;
    --border: #444;
    --accent: #c62828;
}

body {
    background: var(--bg-dark);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    overflow-x: hidden;
    min-height: 100vh;
}

.screen {
    display: none;
    padding: 10px;
    padding-bottom: 80px;
}

.screen.active {
    display: block;
}

h1 {
    text-align: center;
    color: var(--red);
    font-size: 20px;
    margin: 10px 0;
    text-transform: uppercase;
    letter-spacing: 2px;
}

h2 {
    color: var(--text);
    font-size: 16px;
    margin: 10px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
}

/* Player Selection Grid */
.player-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin: 8px 0;
}

.player-check {
    display: flex;
    align-items: center;
    background: var(--bg-card);
    border-radius: 8px;
    padding: 10px 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
}

.player-check.checked {
    border-color: var(--red);
    background: #3a2020;
}

.player-check input {
    display: none;
}

.player-check .checkmark {
    width: 22px;
    height: 22px;
    border: 2px solid var(--border);
    border-radius: 4px;
    margin-right: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
}

.player-check.checked .checkmark {
    background: var(--red);
    border-color: var(--red);
}

.player-check .pname {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Buttons */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    color: white;
}

.btn-red {
    background: var(--red);
}

.btn-red:active {
    background: var(--red-dark);
}

.btn-dark {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
}

.btn-dark:active {
    background: #383838;
}

.btn-green {
    background: var(--green);
}

.btn-full {
    width: 100%;
    margin: 6px 0;
}

.btn-sm {
    padding: 8px 14px;
    font-size: 13px;
}

/* Bottom Nav */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #111;
    border-top: 1px solid var(--border);
    display: none;
    grid-template-columns: repeat(4, 1fr);
    z-index: 100;
}

.bottom-nav.active {
    display: grid;
}

.nav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 4px;
    color: var(--text-dim);
    font-size: 10px;
    cursor: pointer;
    border: none;
    background: none;
    transition: color 0.15s;
}

.nav-btn .nav-icon {
    font-size: 20px;
    margin-bottom: 2px;
}

.nav-btn.active {
    color: var(--red);
}

/* Turn Order Bar */
.turn-order-bar {
    display: flex;
    gap: 4px;
    padding: 8px;
    overflow-x: auto;
    background: #111;
    border-radius: 8px;
    margin-bottom: 10px;
    -webkit-overflow-scrolling: touch;
}

.turn-order-bar::-webkit-scrollbar {
    height: 3px;
}

.turn-order-bar::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 2px;
}

.turn-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4px 6px;
    border-radius: 6px;
    background: var(--bg-card);
    flex-shrink: 0;
    min-width: 52px;
    font-size: 9px;
    text-align: center;
    border: 1px solid var(--border);
}

.turn-chip .turn-emoji {
    font-size: 16px;
}

.turn-chip .turn-name {
    font-size: 8px;
    margin-top: 1px;
    color: var(--text-dim);
    max-width: 56px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.turn-chip .turn-role {
    font-size: 8px;
    font-weight: 600;
}

/* Game Player List */
.game-player-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.game-player-item {
    display: flex;
    align-items: center;
    background: var(--bg-card);
    border-radius: 8px;
    padding: 8px 10px;
    position: relative;
    transition: all 0.2s;
    min-height: 48px;
}

.game-player-item.eliminated {
    opacity: 0.5;
}

.game-player-item.eliminated::after {
    content: '✕';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 36px;
    color: rgba(229, 57, 53, 0.6);
    pointer-events: none;
    font-weight: bold;
}

.gp-number {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #444;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    margin-right: 8px;
    flex-shrink: 0;
}

.gp-name {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.gp-role {
    font-size: 11px;
    margin-right: 8px;
    font-weight: 600;
    cursor: pointer;
}

.gp-elim-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--red);
    background: transparent;
    color: var(--red);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
}

.gp-elim-btn:active {
    background: var(--red);
    color: white;
}

.gp-restore-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--green);
    background: transparent;
    color: var(--green);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-left: 4px;
    transition: all 0.15s;
}

.gp-restore-btn:active {
    background: var(--green);
    color: white;
}

/* Role Modal */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 10px;
}

.modal-overlay.show {
    display: flex;
}

.modal-content {
    background: var(--bg-dark);
    border-radius: 12px;
    width: 100%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 12px;
    border: 1px solid var(--border);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.modal-header h3 {
    font-size: 16px;
    color: var(--red);
}

.modal-close {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--bg-card);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
}

.role-section-title {
    font-size: 12px;
    font-weight: 700;
    margin: 8px 0 4px;
    padding: 4px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.role-section-title.citizen {
    background: rgba(30, 136, 229, 0.15);
    color: var(--blue);
}

.role-section-title.criminal {
    background: rgba(229, 57, 53, 0.15);
    color: var(--red);
}

.role-section-title.renegade {
    background: rgba(253, 216, 53, 0.15);
    color: var(--yellow);
}

.role-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-bottom: 8px;
}

.role-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px 2px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--bg-card);
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    min-height: 60px;
}

.role-btn:active {
    transform: scale(0.95);
}

.role-btn .role-emoji {
    font-size: 20px;
}

.role-btn .role-name {
    font-size: 9px;
    font-weight: 600;
    margin-top: 2px;
    line-height: 1.1;
}

.role-btn.citizen {
    border-color: rgba(30, 136, 229, 0.3);
}

.role-btn.citizen:active {
    background: rgba(30, 136, 229, 0.2);
}

.role-btn.criminal {
    border-color: rgba(229, 57, 53, 0.3);
}

.role-btn.criminal:active {
    background: rgba(229, 57, 53, 0.2);
}

.role-btn.renegade {
    border-color: rgba(253, 216, 53, 0.3);
}

.role-btn.renegade:active {
    background: rgba(253, 216, 53, 0.2);
}

.role-btn-clear {
    border-color: var(--border);
    background: #333;
}

.role-btn-clear .role-emoji {
    font-size: 18px;
}

.color-blue { color: var(--blue); }
.color-red { color: var(--red); }
.color-yellow { color: var(--yellow); }

/* Notepad */
.notepad {
    width: 100%;
    min-height: 300px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
}

/* Start Screen */
.start-logo {
    text-align: center;
    padding: 30px 0 15px;
}

.start-logo .logo-emoji {
    font-size: 64px;
}

.start-logo h1 {
    font-size: 24px;
    margin: 8px 0 2px;
}

.start-logo p {
    color: var(--text-dim);
    font-size: 13px;
}

.select-all-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0;
}

.player-count {
    color: var(--text-dim);
    font-size: 13px;
}

/* Confirm dialog */
.confirm-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 300;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.confirm-overlay.show {
    display: flex;
}

.confirm-box {
    background: var(--bg-card);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    max-width: 320px;
    width: 100%;
    border: 1px solid var(--border);
}

.confirm-box p {
    margin-bottom: 16px;
    font-size: 15px;
}

.confirm-btns {
    display: flex;
    gap: 8px;
}

.confirm-btns .btn {
    flex: 1;
}

/* New Game button in game screen */
.new-game-bar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 8px;
}

.turn-order-label {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
}
</style>
</head>
<body>

<!-- ======= SCREEN 1: SETUP ======= -->
<div id="screen-setup" class="screen active">
    <div class="start-logo">
        <div class="logo-emoji">🔫</div>
        <h1>Мафия</h1>
        <p>Большой Город</p>
    </div>

    <div class="select-all-row">
        <h2 style="margin:0;border:none;padding:0;">Игроки</h2>
        <div>
            <span class="player-count" id="playerCount">0 выбрано</span>
            <button class="btn btn-dark btn-sm" onclick="selectAll()" style="margin-left:6px;">Все</button>
            <button class="btn btn-dark btn-sm" onclick="selectNone()">Сброс</button>
        </div>
    </div>

    <div class="player-grid" id="playerGrid"></div>

    <button class="btn btn-red btn-full" onclick="startGame()" style="margin-top:12px;font-size:17px;padding:16px;">
        🎮 НАЧАТЬ ИГРУ
    </button>
</div>

<!-- ======= SCREEN 2: GAME ======= -->
<div id="screen-game" class="screen">
    <div class="new-game-bar">
        <button class="btn btn-dark btn-sm" onclick="confirmNewGame()">🔄 Новая игра</button>
    </div>

    <div class="turn-order-label">Очередь ходов ночью:</div>
    <div class="turn-order-bar" id="turnOrderBar"></div>

    <h2>Игроки</h2>
    <div class="game-player-list" id="gamePlayerList"></div>
</div>

<!-- ======= SCREEN 3: NOTEPAD ======= -->
<div id="screen-notes" class="screen">
    <h1>📝 Блокнот</h1>
    <textarea class="notepad" id="notepad" placeholder="Записки ведущего..."></textarea>
</div>

<!-- ======= SCREEN 4: ROLES INFO ======= -->
<div id="screen-info" class="screen">
    <h1>📋 Роли</h1>
    <div id="rolesInfoList"></div>
</div>

<!-- ======= BOTTOM NAV ======= -->
<div class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" onclick="switchTab('game')" id="tab-game">
        <span class="nav-icon">🎯</span>
        Игра
    </button>
    <button class="nav-btn" onclick="switchTab('notes')" id="tab-notes">
        <span class="nav-icon">📝</span>
        Заметки
    </button>
    <button class="nav-btn" onclick="switchTab('info')" id="tab-info">
        <span class="nav-icon">📋</span>
        Роли
    </button>
    <button class="nav-btn" onclick="confirmNewGame()" id="tab-new">
        <span class="nav-icon">🔄</span>
        Заново
    </button>
</div>

<!-- ======= ROLE SELECT MODAL ======= -->
<div class="modal-overlay" id="roleModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="roleModalTitle">Выбор роли</h3>
            <button class="modal-close" onclick="closeRoleModal()">✕</button>
        </div>

        <div class="role-section-title citizen">🟦 Горожане</div>
        <div class="role-grid" id="citizenRoles"></div>

        <div class="role-section-title criminal">🟥 Преступники</div>
        <div class="role-grid" id="criminalRoles"></div>

        <div class="role-section-title renegade">🟨 Отщепенцы</div>
        <div class="role-grid" id="renegadeRoles"></div>

        <button class="btn btn-dark btn-full" onclick="assignRole(null)" style="margin-top:8px;">
            ❌ Убрать роль
        </button>
    </div>
</div>

<!-- ======= CONFIRM DIALOG ======= -->
<div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
        <p>Начать новую игру?<br><small style="color:var(--text-dim)">Текущая игра будет сброшена</small></p>
        <div class="confirm-btns">
            <button class="btn btn-dark" onclick="closeConfirm()">Отмена</button>
            <button class="btn btn-red" onclick="newGame()">Да</button>
        </div>
    </div>
</div>

<script>
// ============================================================
// PLAYER LIST — EDIT HERE
// ============================================================
const ALL_PLAYERS = [
    "Димон", "Вова", "Вадим", "Катя", "Влад", "Рома", "Маша", "Инна", "Рябчун", "Виталик", "Стас", "Мотвей", "Надя", "Полина", "Соня", "Оля", "Лена", "Тёма"
];
// ============================================================

// Roles data
const ROLES = {
    citizens: [
        { id: 'peaceful', name: 'Мирный житель', emoji: '🏠', order: null },
        { id: 'agent', name: 'Агент', emoji: '🕵️', order: null },
        { id: 'judge', name: 'Судья', emoji: '⚖️', order: 13 },
        { id: 'detective', name: 'Детектив', emoji: '🔍', order: 8 },
        { id: 'journalist', name: 'Журналист', emoji: '📰', order: 9 },
        { id: 'doctor', name: 'Доктор', emoji: '💊', order: 2 },
        { id: 'bodyguard', name: 'Телохранитель', emoji: '🛡️', order: 3 },
        { id: 'patrol', name: 'Патрульный', emoji: '🚔', order: 8 },
        { id: 'psychic', name: 'Экстрасенс', emoji: '🔮', order: 10 },
        { id: 'fangirl', name: 'Поклонница', emoji: '💋', order: 14 },
        { id: 'sleuth', name: 'Сыщик', emoji: '🧐', order: 12 },
        { id: 'lucky', name: 'Везунчик', emoji: '🍀', order: null },
        { id: 'avenger', name: 'Мститель', emoji: '⚔️', order: null },
    ],
    criminals: [
        { id: 'mafia', name: 'Мафия', emoji: '🔫', order: 4 },
        { id: 'cartel', name: 'Картель', emoji: '💀', order: 5 },
        { id: 'lawyer', name: 'Адвокат', emoji: '📜', order: 1 },
        { id: 'mistress', name: 'Любовница', emoji: '💃', order: 7 },
        { id: 'hound', name: 'Ищейка', emoji: '🐕', order: 11 },
        { id: 'werewolf', name: 'Оборотень', emoji: '🐺', order: null },
        { id: 'boss', name: 'Босс', emoji: '👔', order: null },
        { id: 'ringleader', name: 'Главарь', emoji: '🎩', order: null },
    ],
    renegades: [
        { id: 'maniac', name: 'Маньяк', emoji: '🪓', order: 6 },
        { id: 'poisoner', name: 'Отравитель', emoji: '☠️', order: 6 },
        { id: 'cultist', name: 'Сектант', emoji: '🕯️', order: 6 },
        { id: 'revolutionary', name: 'Революционер', emoji: '✊', order: 6 },
    ]
};

function getRoleById(id) {
    if (!id) return null;
    const all = [...ROLES.citizens, ...ROLES.criminals, ...ROLES.renegades];
    return all.find(r => r.id === id) || null;
}

function getRoleFaction(id) {
    if (!id) return null;
    if (ROLES.citizens.find(r => r.id === id)) return 'citizen';
    if (ROLES.criminals.find(r => r.id === id)) return 'criminal';
    if (ROLES.renegades.find(r => r.id === id)) return 'renegade';
    return null;
}

function getFactionColor(faction) {
    if (faction === 'citizen') return 'var(--blue)';
    if (faction === 'criminal') return 'var(--red)';
    if (faction === 'renegade') return 'var(--yellow)';
    return 'var(--text)';
}

// Game state
let gameState = {
    players: [], // { name, role (id), eliminated }
    active: false
};

let selectedRolePlayerIndex = null;

// ============ SETUP SCREEN ============
function renderSetup() {
    const grid = document.getElementById('playerGrid');
    grid.innerHTML = '';
    ALL_PLAYERS.forEach((name, i) => {
        const div = document.createElement('div');
        div.className = 'player-check';
        div.id = `pcheck-${i}`;
        div.onclick = () => togglePlayer(i);
        div.innerHTML = `
            <input type="checkbox" id="cb-${i}">
            <div class="checkmark">✓</div>
            <span class="pname">${name}</span>
        `;
        grid.appendChild(div);
    });
    updateCount();
}

function togglePlayer(i) {
    const el = document.getElementById(`pcheck-${i}`);
    const cb = document.getElementById(`cb-${i}`);
    cb.checked = !cb.checked;
    el.classList.toggle('checked', cb.checked);
    updateCount();
}

function selectAll() {
    ALL_PLAYERS.forEach((_, i) => {
        document.getElementById(`cb-${i}`).checked = true;
        document.getElementById(`pcheck-${i}`).classList.add('checked');
    });
    updateCount();
}

function selectNone() {
    ALL_PLAYERS.forEach((_, i) => {
        document.getElementById(`cb-${i}`).checked = false;
        document.getElementById(`pcheck-${i}`).classList.remove('checked');
    });
    updateCount();
}

function updateCount() {
    const count = ALL_PLAYERS.filter((_, i) => document.getElementById(`cb-${i}`).checked).length;
    document.getElementById('playerCount').textContent = `${count} выбрано`;
}

function startGame() {
    const selected = ALL_PLAYERS.filter((_, i) => document.getElementById(`cb-${i}`).checked);
    if (selected.length < 3) {
        alert('Выберите хотя бы 3 игроков');
        return;
    }
    gameState.players = selected.map(name => ({ name, role: null, eliminated: false }));
    gameState.active = true;
    document.getElementById('screen-setup').classList.remove('active');
    document.getElementById('screen-game').classList.add('active');
    document.getElementById('bottomNav').classList.add('active');
    renderGame();
}

// ============ GAME SCREEN ============
function renderGame() {
    renderTurnOrder();
    renderPlayerList();
}

function renderTurnOrder() {
    const bar = document.getElementById('turnOrderBar');
    bar.innerHTML = '';

    // Collect living players with roles that have order
    const ordered = [];
    gameState.players.forEach(p => {
        if (p.eliminated) return;
        if (!p.role) return;
        const role = getRoleById(p.role);
        if (!role || role.order === null) return;
        ordered.push({ player: p, role, order: role.order });
    });

    ordered.sort((a, b) => a.order - b.order);

    if (ordered.length === 0) {
        bar.innerHTML = '<div style="color:var(--text-dim);font-size:11px;padding:8px;">Назначьте роли игрокам</div>';
        return;
    }

    ordered.forEach(o => {
        const faction = getRoleFaction(o.player.role);
        const color = getFactionColor(faction);
        const chip = document.createElement('div');
        chip.className = 'turn-chip';
        chip.innerHTML = `
            <span class="turn-emoji">${o.role.emoji}</span>
            <span class="turn-role" style="color:${color}">${o.role.name}</span>
            <span class="turn-name">${o.player.name}</span>
        `;
        bar.appendChild(chip);
    });
}

function renderPlayerList() {
    const list = document.getElementById('gamePlayerList');
    list.innerHTML = '';

    // Sort: alive first, then eliminated
    const sorted = [...gameState.players].sort((a, b) => {
        if (a.eliminated && !b.eliminated) return 1;
        if (!a.eliminated && b.eliminated) return -1;
        return 0;
    });

    sorted.forEach(p => {
        const idx = gameState.players.indexOf(p);
        const role = getRoleById(p.role);
        const faction = getRoleFaction(p.role);
        const color = faction ? getFactionColor(faction) : 'var(--text)';

        const div = document.createElement('div');
        div.className = `game-player-item${p.eliminated ? ' eliminated' : ''}`;

        const roleText = role ? `${role.emoji} ${role.name}` : '—';
        const num = gameState.players.indexOf(p) + 1;

        div.innerHTML = `
            <div class="gp-number">${num}</div>
            <span class="gp-name" style="color:${color}" onclick="openRoleModal(${idx})">${p.name}</span>
            <span class="gp-role" style="color:${color}" onclick="openRoleModal(${idx})">${roleText}</span>
            ${!p.eliminated ?
                `<button class="gp-elim-btn" onclick="eliminatePlayer(${idx})" title="Выбыл">✕</button>` :
                `<button class="gp-restore-btn" onclick="restorePlayer(${idx})" title="Восстановить">↩</button>`
            }
        `;
        list.appendChild(div);
    });
}

function eliminatePlayer(idx) {
    gameState.players[idx].eliminated = true;
    renderGame();
}

function restorePlayer(idx) {
    gameState.players[idx].eliminated = false;
    renderGame();
}

// ============ ROLE MODAL ============
function openRoleModal(idx) {
    selectedRolePlayerIndex = idx;
    const p = gameState.players[idx];
    document.getElementById('roleModalTitle').textContent = `Роль: ${p.name}`;
    document.getElementById('roleModal').classList.add('show');
    renderRoleButtons();
}

function closeRoleModal() {
    document.getElementById('roleModal').classList.remove('show');
    selectedRolePlayerIndex = null;
}

function renderRoleButtons() {
    renderRoleSection('citizenRoles', ROLES.citizens, 'citizen');
    renderRoleSection('criminalRoles', ROLES.criminals, 'criminal');
    renderRoleSection('renegadeRoles', ROLES.renegades, 'renegade');
}

function renderRoleSection(containerId, roles, faction) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    roles.forEach(r => {
        const btn = document.createElement('button');
        btn.className = `role-btn ${faction}`;
        btn.onclick = () => assignRole(r.id);
        const orderStr = r.order !== null ? `#${r.order}` : '';
        btn.innerHTML = `
            <span class="role-emoji">${r.emoji}</span>
            <span class="role-name">${r.name}</span>
            ${orderStr ? `<span style="font-size:8px;color:var(--text-dim)">${orderStr}</span>` : ''}
        `;
        container.appendChild(btn);
    });
}

function assignRole(roleId) {
    if (selectedRolePlayerIndex !== null) {
        gameState.players[selectedRolePlayerIndex].role = roleId;
        closeRoleModal();
        renderGame();
    }
}

// ============ TABS ============
function switchTab(tab) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

    document.getElementById('screen-game').classList.remove('active');
    document.getElementById('screen-notes').classList.remove('active');
    document.getElementById('screen-info').classList.remove('active');

    if (tab === 'game') {
        document.getElementById('screen-game').classList.add('active');
        document.getElementById('tab-game').classList.add('active');
    } else if (tab === 'notes') {
        document.getElementById('screen-notes').classList.add('active');
        document.getElementById('tab-notes').classList.add('active');
    } else if (tab === 'info') {
        document.getElementById('screen-info').classList.add('active');
        document.getElementById('tab-info').classList.add('active');
        renderRolesInfo();
    }
}

// ============ ROLES INFO ============
function renderRolesInfo() {
    const container = document.getElementById('rolesInfoList');
    container.innerHTML = '';

    const sections = [
        { title: '🟦 Горожане', roles: ROLES.citizens, faction: 'citizen', color: 'var(--blue)' },
        { title: '🟥 Преступники', roles: ROLES.criminals, faction: 'criminal', color: 'var(--red)' },
        { title: '🟨 Отщепенцы', roles: ROLES.renegades, faction: 'renegade', color: 'var(--yellow)' },
    ];

    sections.forEach(sec => {
        const h = document.createElement('div');
        h.className = `role-section-title ${sec.faction}`;
        h.textContent = sec.title;
        container.appendChild(h);

        const grid = document.createElement('div');
        grid.style.cssText = 'display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:10px;';

        sec.roles.forEach(r => {
            const item = document.createElement('div');
            item.style.cssText = `background:var(--bg-card);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:6px;`;
            const orderStr = r.order !== null ? ` <span style="color:var(--text-dim);font-size:10px;">#${r.order}</span>` : '';
            item.innerHTML = `
                <span style="font-size:22px;">${r.emoji}</span>
                <span style="color:${sec.color};font-size:13px;font-weight:600;">${r.name}${orderStr}</span>
            `;
            grid.appendChild(item);
        });

        container.appendChild(grid);
    });
}

// ============ NEW GAME ============
function confirmNewGame() {
    document.getElementById('confirmOverlay').classList.add('show');
}

function closeConfirm() {
    document.getElementById('confirmOverlay').classList.remove('show');
}

function newGame() {
    closeConfirm();
    gameState = { players: [], active: false };
    document.getElementById('notepad').value = '';
    document.getElementById('bottomNav').classList.remove('active');
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-setup').classList.add('active');
    renderSetup();
}

// ============ INIT ============
renderSetup();
</script>
</body>
</html>
