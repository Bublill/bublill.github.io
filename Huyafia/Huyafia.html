<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Мафия: Большой Город</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg-dark: #1a1a1a;
    --bg-card: #2a2a2a;
    --bg-input: #333;
    --text-main: #e0e0e0;
    --text-dim: #888;
    --red: #E53935;
    --red-dark: #b71c1c;
    --blue: #1E88E5;
    --yellow: #FDD835;
    --green: #43A047;
    --border: #444;
    --accent: #c62828;
}

body {
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    overflow-x: hidden;
}

.screen {
    display: none;
    padding: 12px;
    padding-bottom: 80px;
}

.screen.active {
    display: block;
}

h1 {
    text-align: center;
    color: var(--red);
    font-size: 20px;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
}

h2 {
    font-size: 16px;
    color: var(--text-dim);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Buttons */
.btn {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    color: #fff;
}

.btn:active {
    transform: scale(0.95);
}

.btn-red {
    background: var(--red);
}

.btn-dark {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-main);
}

.btn-green {
    background: var(--green);
}

.btn-full {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    margin-top: 8px;
}

/* Player selection grid */
.player-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 12px;
}

.player-check {
    display: flex;
    align-items: center;
    background: var(--bg-card);
    border-radius: 8px;
    padding: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
    gap: 8px;
}

.player-check.checked {
    border-color: var(--red);
    background: #3a2020;
}

.player-check input {
    display: none;
}

.check-box {
    width: 22px;
    height: 22px;
    border: 2px solid var(--border);
    border-radius: 4px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
}

.player-check.checked .check-box {
    background: var(--red);
    border-color: var(--red);
}

.check-box::after {
    content: '✓';
    color: #fff;
    font-size: 14px;
    display: none;
}

.player-check.checked .check-box::after {
    display: block;
}

.player-name-label {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Game screen */
.turn-order-bar {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 8px 4px;
    background: var(--bg-card);
    border-radius: 8px;
    margin-bottom: 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}

.turn-order-bar::-webkit-scrollbar {
    display: none;
}

.turn-chip {
    flex-shrink: 0;
    padding: 4px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    background: #333;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 3px;
}

.turn-chip.team-citizen { color: var(--blue); border: 1px solid var(--blue); }
.turn-chip.team-criminal { color: var(--red); border: 1px solid var(--red); }
.turn-chip.team-outcast { color: var(--yellow); border: 1px solid var(--yellow); }

/* Game player list */
.game-player-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 12px;
}

.game-player-card {
    background: var(--bg-card);
    border-radius: 8px;
    padding: 8px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: all 0.2s;
    border: 1px solid var(--border);
}

.game-player-card.eliminated {
    opacity: 0.5;
    order: 999;
}

.game-player-card.eliminated .elim-overlay {
    display: flex;
}

.elim-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(229, 57, 53, 0.15);
    border-radius: 8px;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: var(--red);
    pointer-events: none;
    z-index: 2;
}

.gp-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
}

.gp-name {
    font-weight: 700;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
}

.gp-elim-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(gray);
    background: transparent;
    color: #fff);
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
}

.gp-elim-btn:active {
    background: var(--red);
    color: #f0f0f0;
}

.gp-restore-btn {
    display: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--green);
    background: transparent;
    color: var(--green);
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    z-index: 3;
}

.game-player-card.eliminated .gp-restore-btn {
    display: flex;
}

.game-player-card.eliminated .gp-elim-btn {
    display: none;
}

.gp-role {
    font-size: 12px;
    cursor: pointer;
    padding: 4px 6px;
    background: var(--bg-input);
    border-radius: 4px;
    text-align: center;
    border: 1px solid var(--border);
}

.gp-role:active {
    background: #444;
}

.team-citizen { color: var(--blue) !important; }
.team-criminal { color: var(--red) !important; }
.team-outcast { color: var(--yellow) !important; }

/* Role picker modal */
.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.modal-overlay.active {
    display: flex;
}

.modal {
    background: var(--bg-dark);
    border-radius: 12px;
    width: 100%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto;
    border: 1px solid var(--border);
}

.modal-header {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg-dark);
    z-index: 5;
}

.modal-header h3 {
    font-size: 16px;
    color: var(--text-main);
}

.modal-body {
    padding: 8px;
}

.role-section-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 4px 4px;
}

.role-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 4px;
    margin-bottom: 8px;
}

.role-btn {
    padding: 8px 4px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-card);
    cursor: pointer;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    transition: all 0.1s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

.role-btn:active {
    transform: scale(0.93);
}

.role-btn .role-emoji {
    font-size: 20px;
}

.role-btn .role-label {
    font-size: 10px;
    line-height: 1.1;
}

.role-btn.team-citizen-bg { border-color: var(--blue); }
.role-btn.team-citizen-bg:active { background: rgba(30,136,229,0.2); }
.role-btn.team-criminal-bg { border-color: var(--red); }
.role-btn.team-criminal-bg:active { background: rgba(229,57,53,0.2); }
.role-btn.team-outcast-bg { border-color: var(--yellow); }
.role-btn.team-outcast-bg:active { background: rgba(253,216,53,0.2); }

.modal-close-btn {
    width: 100%;
    padding: 12px;
    background: var(--bg-input);
    border: none;
    color: var(--text-main);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border-top: 1px solid var(--border);
}

.clear-role-btn {
    width: 100%;
    padding: 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    margin-bottom: 8px;
}

/* Notepad */
.notepad-area {
    width: 100%;
    min-height: 120px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-main);
    padding: 10px;
    font-size: 14px;
    resize: vertical;
    font-family: inherit;
}

/* Bottom nav */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #222;
    border-top: 1px solid var(--border);
    display: none;
    z-index: 50;
}

.bottom-nav.active {
    display: flex;
}

.nav-btn {
    flex: 1;
    padding: 10px 4px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

.nav-btn.active {
    color: var(--red);
}

.nav-btn .nav-icon {
    font-size: 20px;
}

/* Toolbar */
.toolbar {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.toolbar .btn {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    padding: 8px;
}

.select-actions {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
}

.select-actions .btn {
    flex: 1;
    font-size: 12px;
    padding: 8px;
}

/* Turn order number badge */
.turn-num {
    font-size: 9px;
    background: #555;
    border-radius: 3px;
    padding: 1px 4px;
    margin-left: 2px;
}

/* Separator */
.sep {
    height: 1px;
    background: var(--border);
    margin: 12px 0;
}

/* Stats bar */
.stats-bar {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.stat-item {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    background: var(--bg-card);
    border-radius: 6px;
}
</style>
</head>
<body>

<!-- ==================== SCREEN 1: LOBBY ==================== -->
<div id="screen-lobby" class="screen active">
    <h1>🔫 Мафия: Большой Город</h1>
    <h2>Выбери игроков</h2>
    
    <div class="select-actions">
        <button class="btn btn-dark" onclick="selectAll()">Выбрать всех</button>
        <button class="btn btn-dark" onclick="deselectAll()">Снять все</button>
    </div>
    
    <div id="lobby-players" class="player-grid"></div>
    
    <button class="btn btn-red btn-full" onclick="startGame()">🎮 НАЧАТЬ ИГРУ</button>
</div>

<!-- ==================== SCREEN 2: GAME ==================== -->
<div id="screen-game" class="screen">
    <h1>🌙 Игра</h1>
    
    <h2>Очередь ходов</h2>
    <div id="turn-order" class="turn-order-bar"></div>
    
    <div id="stats-bar" class="stats-bar"></div>
    
    <h2>Игроки</h2>
    <div id="game-players" class="game-player-grid"></div>
</div>

<!-- ==================== SCREEN 3: NOTEPAD ==================== -->
<div id="screen-notes" class="screen">
    <h1>📝 Блокнот</h1>
    <textarea id="notepad" class="notepad-area" placeholder="Записывай заметки здесь..."></textarea>
</div>

<!-- ==================== BOTTOM NAV ==================== -->
<div id="bottom-nav" class="bottom-nav">
    <button class="nav-btn active" onclick="showScreen('game')">
        <span class="nav-icon">🎮</span>
        Игра
    </button>
    <button class="nav-btn" onclick="showScreen('notes')">
        <span class="nav-icon">📝</span>
        Блокнот
    </button>
    <button class="nav-btn" onclick="endGame()">
        <span class="nav-icon">🚪</span>
        Выход
    </button>
</div>

<!-- ==================== ROLE PICKER MODAL ==================== -->
<div id="role-modal" class="modal-overlay" onclick="closeModalOutside(event)">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-title">Выбери роль</h3>
        </div>
        <div class="modal-body">
            <button class="clear-role-btn" onclick="pickRole(null)">❌ Убрать роль</button>

            <div class="role-section-title team-citizen">🔵 Горожане</div>
            <div id="roles-citizen" class="role-grid"></div>

            <div class="role-section-title team-criminal">🔴 Преступники</div>
            <div id="roles-criminal" class="role-grid"></div>

            <div class="role-section-title team-outcast">🟡 Отщепенцы</div>
            <div id="roles-outcast" class="role-grid"></div>
        </div>
        <button class="modal-close-btn" onclick="closeModal()">Закрыть</button>
    </div>
</div>

<script>
// ===================================================================
// НАСТРОЙКА ИГРОКОВ — МЕНЯЙ ЗДЕСЬ!
// ===================================================================
const ALL_PLAYERS = [
    "Димон", "Вова", "Вадим", "Катя", "Влад", "Рома", "Маша", "Инна", "Рябчун", "Виталик", "Стас", "Мотвей", "Надя", "Полина", "Соня", "Оля", "Лена", "Тёма"
];
// ===================================================================

// Roles definition: { id, name, emoji, team, turnOrder (null = no night action) }
const ROLES = [
    // Горожане (citizen)
    { id: 'peaceful',     name: 'Мирный',       emoji: '🧑',  team: 'citizen',  turnOrder: null },
    { id: 'agent',        name: 'Агент',         emoji: '🕵️',  team: 'citizen',  turnOrder: 4 },
    { id: 'judge',        name: 'Судья',         emoji: '⚖️',  team: 'citizen',  turnOrder: 13 },
    { id: 'detective',    name: 'Детектив',      emoji: '🔍',  team: 'citizen',  turnOrder: 8 },
    { id: 'journalist',   name: 'Журналист',     emoji: '📰',  team: 'citizen',  turnOrder: 9 },
    { id: 'doctor',       name: 'Доктор',        emoji: '💊',  team: 'citizen',  turnOrder: 2 },
    { id: 'bodyguard',    name: 'Телохранитель', emoji: '🛡️',  team: 'citizen',  turnOrder: 3 },
    { id: 'patrol',       name: 'Патрульный',    emoji: '🚔',  team: 'citizen',  turnOrder: 8 },
    { id: 'psychic',      name: 'Экстрасенс',   emoji: '🔮',  team: 'citizen',  turnOrder: 10 },
    { id: 'fangirl',      name: 'Поклонница',    emoji: '💋',  team: 'citizen',  turnOrder: 14 },
    { id: 'sleuth',       name: 'Сыщик',         emoji: '🧐',  team: 'citizen',  turnOrder: 12 },
    { id: 'lucky',        name: 'Везунчик',      emoji: '🍀',  team: 'citizen',  turnOrder: null },
    { id: 'avenger',      name: 'Мститель',      emoji: '⚔️',  team: 'citizen',  turnOrder: null },
    // Преступники (criminal)
    { id: 'mafia',        name: 'Мафия',         emoji: '🔫',  team: 'criminal', turnOrder: 4 },
    { id: 'cartel',       name: 'Картель',       emoji: '💀',  team: 'criminal', turnOrder: 5 },
    { id: 'lawyer',       name: 'Адвокат',       emoji: '📜',  team: 'criminal', turnOrder: 1 },
    { id: 'mistress',     name: 'Любовница',     emoji: '❤️‍🔥', team: 'criminal', turnOrder: 7 },
    { id: 'tracker',      name: 'Ищейка',        emoji: '🐕',  team: 'criminal', turnOrder: 11 },
    { id: 'werewolf',     name: 'Оборотень',     emoji: '🐺',  team: 'criminal', turnOrder: 4 },
    { id: 'boss',         name: 'Босс',          emoji: '👔',  team: 'criminal', turnOrder: 4 },
    { id: 'leader',       name: 'Главарь',       emoji: '🎩',  team: 'criminal', turnOrder: 5 },
    // Отщепенцы (outcast)
    { id: 'maniac',       name: 'Маньяк',        emoji: '🪓',  team: 'outcast',  turnOrder: 6 },
    { id: 'poisoner',     name: 'Отравитель',    emoji: '☠️',  team: 'outcast',  turnOrder: 6 },
    { id: 'sectant',      name: 'Сектант',       emoji: '🕯️',  team: 'outcast',  turnOrder: 6 },
    { id: 'revolutionary',name: 'Революционер',  emoji: '✊',  team: 'outcast',  turnOrder: 6 },
];

// State
let selectedPlayers = new Set();
let gamePlayers = []; // [{name, role: null|roleObj, eliminated: false}]
let currentPickerPlayer = null;

// ===== LOBBY =====
function renderLobby() {
    const c = document.getElementById('lobby-players');
    c.innerHTML = '';
    ALL_PLAYERS.forEach(name => {
        const div = document.createElement('div');
        div.className = 'player-check' + (selectedPlayers.has(name) ? ' checked' : '');
        div.innerHTML = `<div class="check-box"></div><span class="player-name-label">${name}</span>`;
        div.onclick = () => {
            if (selectedPlayers.has(name)) selectedPlayers.delete(name);
            else selectedPlayers.add(name);
            renderLobby();
        };
        c.appendChild(div);
    });
}

function selectAll() {
    ALL_PLAYERS.forEach(n => selectedPlayers.add(n));
    renderLobby();
}

function deselectAll() {
    selectedPlayers.clear();
    renderLobby();
}

// ===== GAME =====
function startGame() {
    if (selectedPlayers.size < 2) {
        alert('Выбери хотя бы 2 игроков!');
        return;
    }
    gamePlayers = Array.from(selectedPlayers).map(name => ({
        name,
        role: null,
        eliminated: false
    }));
    document.getElementById('screen-lobby').classList.remove('active');
    document.getElementById('screen-game').classList.add('active');
    document.getElementById('bottom-nav').classList.add('active');
    renderGame();
}

function renderGame() {
    renderTurnOrder();
    renderStats();
    renderGamePlayers();
}

function renderStats() {
    const alive = gamePlayers.filter(p => !p.eliminated);
    const total = gamePlayers.length;
    const citizens = alive.filter(p => p.role && p.role.team === 'citizen').length;
    const criminals = alive.filter(p => p.role && p.role.team === 'criminal').length;
    const outcasts = alive.filter(p => p.role && p.role.team === 'outcast').length;
    const unassigned = alive.filter(p => !p.role).length;
    
    const bar = document.getElementById('stats-bar');
    bar.innerHTML = `
        <span class="stat-item">👥 ${alive.length}/${total}</span>
        <span class="stat-item team-citizen">🔵 ${citizens}</span>
        <span class="stat-item team-criminal">🔴 ${criminals}</span>
        <span class="stat-item team-outcast">🟡 ${outcasts}</span>
        ${unassigned ? `<span class="stat-item">❓ ${unassigned}</span>` : ''}
    `;
}

function renderTurnOrder() {
    const bar = document.getElementById('turn-order');
    bar.innerHTML = '';
    
    const ordered = gamePlayers
        .filter(p => !p.eliminated && p.role && p.role.turnOrder !== null)
        .sort((a, b) => a.role.turnOrder - b.role.turnOrder);
    
    if (ordered.length === 0) {
        bar.innerHTML = '<span style="color:#666;font-size:12px;padding:4px;">Назначьте роли, чтобы увидеть очередь</span>';
        return;
    }
    
    ordered.forEach(p => {
        const chip = document.createElement('div');
        const teamClass = 'team-' + p.role.team;
        chip.className = 'turn-chip ' + teamClass;
        chip.style.flexDirection = 'column';
        chip.style.textAlign = 'center';
        chip.style.padding = '6px 10px';
        chip.innerHTML = `
            <span style="font-size:14px;">${p.role.emoji}</span>
            <span style="font-size:11px;font-weight:700;">${p.role.name}</span>
            <span style="font-size:9px;opacity:0.7;">${p.name}</span>
        `;
        bar.appendChild(chip);
    });
}

function renderGamePlayers() {
    const c = document.getElementById('game-players');
    c.innerHTML = '';
    
    // Sort: alive first, eliminated last
    const sorted = [...gamePlayers].sort((a, b) => {
        if (a.eliminated && !b.eliminated) return 1;
        if (!a.eliminated && b.eliminated) return -1;
        return 0;
    });
    
    sorted.forEach((p, _) => {
        const idx = gamePlayers.indexOf(p);
        const card = document.createElement('div');
        card.className = 'game-player-card' + (p.eliminated ? ' eliminated' : '');
        
        const teamClass = p.role ? 'team-' + p.role.team : '';
        const roleText = p.role ? `${p.role.emoji} ${p.role.name}` : '❓ Назначить роль';
        
        card.innerHTML = `
            <div class="elim-overlay">✕</div>
            <div class="gp-top">
                <span class="gp-name ${teamClass}">${p.name}</span>
                <button class="gp-restore-btn" onclick="restorePlayer(${idx})">↩</button>
                <button class="gp-elim-btn" onclick="eliminatePlayer(${idx})">✕</button>
            </div>
            <div class="gp-role ${teamClass}" onclick="openRolePicker(${idx})">${roleText}</div>
        `;
        c.appendChild(card);
    });
}

function eliminatePlayer(idx) {
    gamePlayers[idx].eliminated = true;
    renderGame();
}

function restorePlayer(idx) {
    gamePlayers[idx].eliminated = false;
    renderGame();
}

// ===== ROLE PICKER =====
function openRolePicker(idx) {
    currentPickerPlayer = idx;
    document.getElementById('modal-title').textContent = `Роль для: ${gamePlayers[idx].name}`;
    document.getElementById('role-modal').classList.add('active');
    renderRoleButtons();
}

function renderRoleButtons() {
    const containers = {
        citizen: document.getElementById('roles-citizen'),
        criminal: document.getElementById('roles-criminal'),
        outcast: document.getElementById('roles-outcast'),
    };
    
    Object.values(containers).forEach(c => c.innerHTML = '');
    
    ROLES.forEach(role => {
        const btn = document.createElement('button');
        const bgClass = 'team-' + role.team + '-bg';
        const textClass = 'team-' + role.team;
        btn.className = `role-btn ${bgClass}`;
        btn.innerHTML = `<span class="role-emoji">${role.emoji}</span><span class="role-label ${textClass}">${role.name}</span>`;
        btn.onclick = () => pickRole(role);
        containers[role.team].appendChild(btn);
    });
}

function pickRole(role) {
    if (currentPickerPlayer !== null) {
        gamePlayers[currentPickerPlayer].role = role;
    }
    closeModal();
    renderGame();
}

function closeModal() {
    document.getElementById('role-modal').classList.remove('active');
    currentPickerPlayer = null;
}

function closeModalOutside(e) {
    if (e.target === document.getElementById('role-modal')) {
        closeModal();
    }
}

// ===== NAVIGATION =====
function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach((b, i) => {
        b.classList.toggle('active', 
            (name === 'game' && i === 0) || (name === 'notes' && i === 1));
    });
}

function endGame() {
    if (!confirm('Завершить игру?')) return;
    document.getElementById('bottom-nav').classList.remove('active');
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-lobby').classList.add('active');
    gamePlayers = [];
    document.getElementById('notepad').value = '';
}

// ===== INIT =====
renderLobby();
</script>
</body>
</html>
