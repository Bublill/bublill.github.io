<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Мафия — Помощник Ведущего</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg-dark: #1a1a1e;
    --bg-card: #2a2a2e;
    --bg-card-hover: #333338;
    --bg-surface: #222226;
    --text-primary: #e8e8e8;
    --text-secondary: #999;
    --red-accent: #E53935;
    --red-dark: #b71c1c;
    --blue-role: #1E88E5;
    --red-role: #E53935;
    --yellow-role: #FDD835;
    --border-color: #3a3a3e;
    --green-accent: #43a047;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
}

.screen {
    display: none;
    padding: 12px;
    padding-bottom: 80px;
}

.screen.active {
    display: block;
}

h1 {
    font-size: 22px;
    text-align: center;
    padding: 12px 0;
    color: var(--red-accent);
    text-transform: uppercase;
    letter-spacing: 2px;
}

h2 {
    font-size: 16px;
    color: var(--text-secondary);
    margin: 10px 0 8px;
    padding-left: 4px;
}

/* PLAYER GRID */
.player-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}

.player-grid.three-col {
    grid-template-columns: 1fr 1fr 1fr;
}

.player-item {
    background: var(--bg-card);
    border: 2px solid var(--border-color);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    position: relative;
    overflow: hidden;
}

.player-item.selected {
    border-color: var(--red-accent);
    background: rgba(229, 57, 53, 0.15);
}

.player-item .checkmark {
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.15s;
}

.player-item.selected .checkmark {
    opacity: 1;
}

/* BUTTONS */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    gap: 6px;
}

.btn-primary {
    background: var(--red-accent);
    color: white;
    width: 100%;
}

.btn-primary:active {
    background: var(--red-dark);
    transform: scale(0.97);
}

.btn-secondary {
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    width: 100%;
}

.btn-secondary:active {
    background: var(--bg-card-hover);
}

.btn-small {
    padding: 8px 14px;
    font-size: 13px;
    border-radius: 8px;
}

.btn-row {
    display: flex;
    gap: 8px;
    margin: 10px 0;
}

.btn-row .btn {
    flex: 1;
}

.btn-green {
    background: var(--green-accent);
    color: white;
    width: 100%;
}

.btn-green:active {
    background: #2e7d32;
    transform: scale(0.97);
}

/* GAME SCREEN */
.game-player-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}

.game-player {
    background: var(--bg-card);
    border: 2px solid var(--border-color);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: all 0.15s;
}

.game-player .player-name {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
}

.game-player .player-role {
    font-size: 12px;
    font-weight: 500;
}

.game-player .player-role.unassigned {
    color: var(--text-secondary);
    font-style: italic;
}

.game-player.eliminated {
    opacity: 0.5;
}

.game-player.eliminated::after {
    content: '✕';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    color: rgba(229, 57, 53, 0.6);
    font-weight: bold;
    pointer-events: none;
}

.game-player.role-assigned {
    border-color: var(--border-color);
}

/* ROLE SELECTION MODAL */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    overflow-y: auto;
    padding: 12px;
}

.modal-overlay.active {
    display: block;
}

.modal-content {
    background: var(--bg-surface);
    border-radius: 14px;
    padding: 14px;
    max-width: 500px;
    margin: 0 auto;
}

.modal-title {
    font-size: 18px;
    text-align: center;
    margin-bottom: 12px;
    color: var(--text-primary);
}

.role-category-title {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 10px 0 6px;
    padding-left: 4px;
}

.role-category-title.blue { color: var(--blue-role); }
.role-category-title.red { color: var(--red-role); }
.role-category-title.yellow { color: var(--yellow-role); }

.role-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
}

.role-item {
    background: var(--bg-card);
    border: 2px solid var(--border-color);
    border-radius: 8px;
    padding: 9px 6px;
    text-align: center;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.12s;
    user-select: none;
}

.role-item .role-order {
    font-size: 10px;
    color: var(--text-secondary);
    display: block;
    margin-top: 2px;
}

.role-item.blue { color: var(--blue-role); border-color: rgba(30,136,229,0.25); }
.role-item.red { color: var(--red-role); border-color: rgba(229,57,53,0.25); }
.role-item.yellow { color: var(--yellow-role); border-color: rgba(253,216,53,0.25); }

.role-item:active {
    transform: scale(0.95);
}

.role-item.blue:active { background: rgba(30,136,229,0.15); }
.role-item.red:active { background: rgba(229,57,53,0.15); }
.role-item.yellow:active { background: rgba(253,216,53,0.15); }

/* ACTION BUTTONS */
.modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.modal-actions .btn {
    flex: 1;
}

.btn-danger {
    background: rgba(229, 57, 53, 0.2);
    color: var(--red-accent);
    border: 1px solid var(--red-accent);
    width: 100%;
}

.btn-danger:active {
    background: rgba(229, 57, 53, 0.4);
}

.btn-warn {
    background: rgba(253, 216, 53, 0.15);
    color: var(--yellow-role);
    border: 1px solid rgba(253, 216, 53, 0.4);
    width: 100%;
}

/* COUNTER */
.player-count {
    text-align: center;
    color: var(--text-secondary);
    font-size: 13px;
    margin: 8px 0;
}

/* STATUS BAR */
.status-bar {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 10px;
    margin: 8px 0;
    display: flex;
    justify-content: space-around;
    text-align: center;
}

.status-item {
    font-size: 12px;
    color: var(--text-secondary);
}

.status-item .num {
    font-size: 20px;
    font-weight: 700;
    display: block;
}

.status-item .num.alive { color: var(--green-accent); }
.status-item .num.dead { color: var(--red-accent); }
.status-item .num.norole { color: var(--yellow-role); }

/* NIGHT ORDER */
.night-order-bar {
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 8px 10px;
    margin: 8px 0;
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
}

.night-order-bar::-webkit-scrollbar {
    display: none;
}

.night-order-chip {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    margin-right: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
}

.night-order-chip.blue { color: var(--blue-role); border-color: rgba(30,136,229,0.3); }
.night-order-chip.red { color: var(--red-role); border-color: rgba(229,57,53,0.3); }
.night-order-chip.yellow { color: var(--yellow-role); border-color: rgba(253,216,53,0.3); }
.night-order-chip.eliminated { opacity: 0.3; text-decoration: line-through; }

.section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin: 10px 0 4px 4px;
}

/* RESET */
.btn-reset {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    font-size: 12px;
    padding: 8px;
    margin-top: 20px;
}

.btn-reset:active {
    color: var(--red-accent);
    border-color: var(--red-accent);
}

/* SEPARATOR */
.sep {
    height: 1px;
    background: var(--border-color);
    margin: 12px 0;
}

/* SELECT ALL ROW */
.select-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}

.select-row .btn {
    flex: 1;
}
</style>
</head>
<body>

<!-- ============ SCREEN 1: PLAYER SELECT ============ -->
<div id="screen-lobby" class="screen active">
    <h1>🔫 Мафия</h1>
    <h2>Выбери игроков:</h2>

    <div class="select-row">
        <button class="btn btn-secondary btn-small" onclick="selectAll()">Выбрать всех</button>
        <button class="btn btn-secondary btn-small" onclick="selectNone()">Снять все</button>
    </div>

    <div class="player-grid" id="lobby-grid"></div>

    <div class="player-count" id="player-count">Выбрано: 0</div>

    <button class="btn btn-primary" onclick="startGame()" id="btn-start">🎮 Начать игру</button>
</div>

<!-- ============ SCREEN 2: GAME ============ -->
<div id="screen-game" class="screen">
    <h1>🌙 Игра</h1>

    <div class="status-bar" id="status-bar"></div>

    <div class="section-label">Порядок ночи (скролль →)</div>
    <div class="night-order-bar" id="night-order"></div>

    <div class="section-label" style="margin-top:10px">Игроки</div>
    <div class="game-player-grid" id="game-grid"></div>

    <div class="sep"></div>
    <button class="btn btn-reset" onclick="endGame()">🔄 Завершить игру</button>
</div>

<!-- ============ MODAL: ROLE SELECT ============ -->
<div class="modal-overlay" id="modal-role">
    <div class="modal-content">
        <div class="modal-title" id="modal-player-name"></div>

        <div id="modal-current-role" style="text-align:center;margin-bottom:8px;font-size:13px;color:var(--text-secondary)"></div>

        <div class="role-category-title blue">🏘 Горожане</div>
        <div class="role-grid" id="roles-town"></div>

        <div class="role-category-title red">🔪 Преступники</div>
        <div class="role-grid" id="roles-crime"></div>

        <div class="role-category-title yellow">🐺 Отщепенцы</div>
        <div class="role-grid" id="roles-outcast"></div>

        <div class="modal-actions">
            <button class="btn btn-danger btn-small" id="btn-eliminate" onclick="toggleEliminate()">☠ Выбыл</button>
            <button class="btn btn-warn btn-small" id="btn-clear-role" onclick="clearRole()">✖ Убрать роль</button>
            <button class="btn btn-secondary btn-small" onclick="closeModal()">Закрыть</button>
        </div>
    </div>
</div>

<script>
// =============================================
// СПИСОК ИГРОКОВ — РЕДАКТИРУЙ ЗДЕСЬ:
// =============================================
const ALL_PLAYERS = [
    "Димон", "Вова", "Вадим", "Катя", "Влад", "Рома", "Маша", "Инна", "Рябчун", "Виталик", "Стас", "Мотвей", "Надя", "Полина", "Соня", "Оля", "Лена", "Тёма"
];
// =============================================

// ROLES DATA
// order = ночной порядок хода (0 = не ходит ночью)
const ROLES = [
    // Горожане (blue)
    { name: "Мирный житель", emoji: "🧑", team: "blue", order: 0 },
    { name: "Агент", emoji: "🕵️", team: "blue", order: 0 },
    { name: "Судья", emoji: "⚖️", team: "blue", order: 13 },
    { name: "Детектив", emoji: "🔍", team: "blue", order: 8 },
    { name: "Журналист", emoji: "📰", team: "blue", order: 9 },
    { name: "Доктор", emoji: "💊", team: "blue", order: 2 },
    { name: "Телохранитель", emoji: "🛡️", team: "blue", order: 3 },
    { name: "Патрульный", emoji: "🚔", team: "blue", order: 8 },
    { name: "Экстрасенс", emoji: "🔮", team: "blue", order: 10 },
    { name: "Поклонница", emoji: "💋", team: "blue", order: 14 },
    { name: "Сыщик", emoji: "🧐", team: "blue", order: 12 },
    { name: "Везунчик", emoji: "🍀", team: "blue", order: 0 },
    { name: "Мститель", emoji: "💀", team: "blue", order: 0 },

    // Преступники (red)
    { name: "Мафия", emoji: "🔫", team: "red", order: 4 },
    { name: "Картель", emoji: "💣", team: "red", order: 5 },
    { name: "Адвокат", emoji: "📜", team: "red", order: 1 },
    { name: "Любовница", emoji: "❤️‍🔥", team: "red", order: 7 },
    { name: "Ищейка", emoji: "🐕", team: "red", order: 11 },
    { name: "Оборотень", emoji: "🐺", team: "red", order: 4 },
    { name: "Босс", emoji: "🎩", team: "red", order: 4 },
    { name: "Главарь", emoji: "👑", team: "red", order: 5 },

    // Отщепенцы (yellow)
    { name: "Маньяк", emoji: "🪓", team: "yellow", order: 6 },
    { name: "Отравитель", emoji: "☠️", team: "yellow", order: 6 },
    { name: "Сектант", emoji: "🕯️", team: "yellow", order: 6 },
    { name: "Революционер", emoji: "✊", team: "yellow", order: 6 },
];

// Night order labels
const NIGHT_ORDER_NAMES = {
    1: "Адвокат", 2: "Доктор", 3: "Телохранитель", 4: "Мафия",
    5: "Картель", 6: "Отщепенец", 7: "Любовница",
    8: "Детектив/Патрульный", 9: "Журналист", 10: "Экстрасенс",
    11: "Ищейка", 12: "Сыщик", 13: "Судья", 14: "Поклонница"
};

// Game state
let selectedPlayers = new Set();
let gamePlayers = []; // [{name, role, eliminated}]
let currentEditIndex = -1;

// ============ LOBBY ============
function renderLobby() {
    const grid = document.getElementById('lobby-grid');
    grid.innerHTML = '';
    ALL_PLAYERS.forEach((name, i) => {
        const div = document.createElement('div');
        div.className = 'player-item' + (selectedPlayers.has(i) ? ' selected' : '');
        div.innerHTML = `${name}<span class="checkmark">✓</span>`;
        div.onclick = () => togglePlayer(i);
        grid.appendChild(div);
    });
    updateCount();
}

function togglePlayer(i) {
    if (selectedPlayers.has(i)) selectedPlayers.delete(i);
    else selectedPlayers.add(i);
    renderLobby();
}

function selectAll() {
    ALL_PLAYERS.forEach((_, i) => selectedPlayers.add(i));
    renderLobby();
}

function selectNone() {
    selectedPlayers.clear();
    renderLobby();
}

function updateCount() {
    document.getElementById('player-count').textContent = `Выбрано: ${selectedPlayers.size}`;
}

// ============ START GAME ============
function startGame() {
    if (selectedPlayers.size < 3) {
        alert('Выбери хотя бы 3 игроков');
        return;
    }
    gamePlayers = [];
    selectedPlayers.forEach(i => {
        gamePlayers.push({ name: ALL_PLAYERS[i], role: null, eliminated: false });
    });
    document.getElementById('screen-lobby').classList.remove('active');
    document.getElementById('screen-game').classList.add('active');
    renderGame();
}

function endGame() {
    if (!confirm('Завершить игру?')) return;
    document.getElementById('screen-game').classList.remove('active');
    document.getElementById('screen-lobby').classList.add('active');
    gamePlayers = [];
}

// ============ GAME RENDER ============
function renderGame() {
    renderGameGrid();
    renderStatusBar();
    renderNightOrder();
}

function renderGameGrid() {
    const grid = document.getElementById('game-grid');
    grid.innerHTML = '';
    gamePlayers.forEach((p, i) => {
        const div = document.createElement('div');
        let cls = 'game-player';
        if (p.eliminated) cls += ' eliminated';
        if (p.role) cls += ' role-assigned';
        div.className = cls;

        let roleHTML;
        if (p.role) {
            const r = ROLES.find(r => r.name === p.role);
            const color = r ? `var(--${r.team}-role)` : 'var(--text-secondary)';
            roleHTML = `<div class="player-role" style="color:${color}">${r ? r.emoji : ''} ${p.role}</div>`;
        } else {
            roleHTML = `<div class="player-role unassigned">нет роли</div>`;
        }

        div.innerHTML = `<div class="player-name">${p.name}</div>${roleHTML}`;
        div.onclick = () => openModal(i);
        grid.appendChild(div);
    });
}

function renderStatusBar() {
    const alive = gamePlayers.filter(p => !p.eliminated).length;
    const dead = gamePlayers.filter(p => p.eliminated).length;
    const norole = gamePlayers.filter(p => !p.role && !p.eliminated).length;
    document.getElementById('status-bar').innerHTML = `
        <div class="status-item"><span class="num alive">${alive}</span>Живых</div>
        <div class="status-item"><span class="num dead">${dead}</span>Выбыли</div>
        <div class="status-item"><span class="num norole">${norole}</span>Без роли</div>
    `;
}

function renderNightOrder() {
    const bar = document.getElementById('night-order');
    // Collect assigned roles with night order > 0
    const activeRoles = [];
    gamePlayers.forEach(p => {
        if (!p.role) return;
        const r = ROLES.find(r => r.name === p.role);
        if (!r || r.order === 0) return;
        activeRoles.push({ ...r, playerName: p.name, eliminated: p.eliminated });
    });

    // Sort by order
    activeRoles.sort((a, b) => a.order - b.order);

    if (activeRoles.length === 0) {
        bar.innerHTML = '<span style="color:var(--text-secondary);font-size:12px">Назначь роли — тут появится порядок ночи</span>';
        return;
    }

    bar.innerHTML = activeRoles.map(r => {
        let cls = `night-order-chip ${r.team}`;
        if (r.eliminated) cls += ' eliminated';
        return `<span class="${cls}">${r.order}. ${r.emoji} ${r.playerName}</span>`;
    }).join('');
}

// ============ MODAL ============
function openModal(idx) {
    currentEditIndex = idx;
    const p = gamePlayers[idx];
    document.getElementById('modal-player-name').textContent = p.name;

    if (p.role) {
        const r = ROLES.find(r => r.name === p.role);
        const color = r ? `var(--${r.team}-role)` : 'var(--text-secondary)';
        document.getElementById('modal-current-role').innerHTML = `Текущая роль: <span style="color:${color};font-weight:600">${r ? r.emoji : ''} ${p.role}</span>`;
    } else {
        document.getElementById('modal-current-role').innerHTML = 'Роль не назначена';
    }

    document.getElementById('btn-eliminate').textContent = p.eliminated ? '💚 Вернуть' : '☠ Выбыл';

    renderRolesInModal();
    document.getElementById('modal-role').classList.add('active');
}

function closeModal() {
    document.getElementById('modal-role').classList.remove('active');
    currentEditIndex = -1;
}

function renderRolesInModal() {
    const towns = ROLES.filter(r => r.team === 'blue');
    const crimes = ROLES.filter(r => r.team === 'red');
    const outcasts = ROLES.filter(r => r.team === 'yellow');

    document.getElementById('roles-town').innerHTML = towns.map(r => roleButton(r)).join('');
    document.getElementById('roles-crime').innerHTML = crimes.map(r => roleButton(r)).join('');
    document.getElementById('roles-outcast').innerHTML = outcasts.map(r => roleButton(r)).join('');
}

function roleButton(r) {
    const orderLabel = r.order > 0 ? `<span class="role-order">Ход: ${r.order}</span>` : `<span class="role-order">—</span>`;
    return `<div class="role-item ${r.team}" onclick="assignRole('${r.name}')">${r.emoji} ${r.name}${orderLabel}</div>`;
}

function assignRole(roleName) {
    if (currentEditIndex < 0) return;
    gamePlayers[currentEditIndex].role = roleName;
    closeModal();
    renderGame();
}

function clearRole() {
    if (currentEditIndex < 0) return;
    gamePlayers[currentEditIndex].role = null;
    closeModal();
    renderGame();
}

function toggleEliminate() {
    if (currentEditIndex < 0) return;
    gamePlayers[currentEditIndex].eliminated = !gamePlayers[currentEditIndex].eliminated;
    closeModal();
    renderGame();
}

// ============ INIT ============
renderLobby();
</script>
</body>
</html>
