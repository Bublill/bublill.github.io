<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Мафия - Помощник Ведущего</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 10px;
            padding-bottom: 80px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 1.1rem;
            margin: 10px 0;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
        }

        /* Сетка для списков */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .grid-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        /* Карточка игрока для выбора */
        .player-select {
            background: rgba(255,255,255,0.1);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .player-select.selected {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.3);
        }

        .player-select:active {
            transform: scale(0.95);
        }

        /* Карточка игрока в игре */
        .player-card {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .player-card:active {
            transform: scale(0.95);
        }

        .player-card .name {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .player-card .role {
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
        }

        .player-card .role.unset {
            color: #888;
            font-style: italic;
        }

        /* Крестик для выбывших */
        .player-card.eliminated::after {
            content: "✕";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            color: rgba(255, 0, 0, 0.6);
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .player-card.eliminated {
            opacity: 0.6;
        }

        /* Цвета ролей */
        .role-citizen { color: #1E88E5; }
        .role-criminal { color: #E53935; }
        .role-renegade { color: #FDD835; }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            padding: 15px;
            overflow-y: auto;
        }

        .modal.active {
            display: block;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.2rem;
        }

        .close-btn {
            background: #E53935;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Кнопки ролей */
        .role-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid;
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .role-btn:active {
            transform: scale(0.95);
        }

        .role-btn.citizen {
            border-color: #1E88E5;
            color: #1E88E5;
        }

        .role-btn.criminal {
            border-color: #E53935;
            color: #E53935;
        }

        .role-btn.renegade {
            border-color: #FDD835;
            color: #FDD835;
        }

        .role-btn .emoji {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 4px;
        }

        /* Кнопки действий */
        .btn {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-danger {
            background: #E53935;
        }

        .btn-secondary {
            background: #666;
        }

        /* Нижняя панель */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 46, 0.95);
            padding: 10px;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .bottom-bar .btn {
            margin: 0;
            flex: 1;
            padding: 12px;
            font-size: 0.9rem;
        }

        /* Секции */
        .section {
            margin-bottom: 20px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .section-title span {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-citizen { background: #1E88E5; }
        .dot-criminal { background: #E53935; }
        .dot-renegade { background: #FDD835; }

        /* Действия с игроком */
        .player-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .player-actions .btn {
            flex: 1;
        }

        .hidden {
            display: none !important;
        }

        /* Статистика */
        .stats {
            display: flex;
            justify-content: space-around;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .stats div {
            text-align: center;
        }

        .stats .count {
            font-size: 1.3rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- ЭКРАН 1: Выбор игроков -->
    <div id="screen-select">
        <h1>🎭 Мафия: Большой Город</h1>
        <h2>Выбери игроков для новой игры:</h2>
        <div id="players-list" class="grid"></div>
        <button class="btn" onclick="startGame()">▶️ Начать игру</button>
    </div>

    <!-- ЭКРАН 2: Игра -->
    <div id="screen-game" class="hidden">
        <h1>🌙 Игра</h1>
        
        <div class="stats">
            <div>
                <div class="count" id="stat-alive">0</div>
                <div>Живых</div>
            </div>
            <div>
                <div class="count" style="color:#1E88E5" id="stat-citizens">0</div>
                <div>Горожан</div>
            </div>
            <div>
                <div class="count" style="color:#E53935" id="stat-criminals">0</div>
                <div>Преступн.</div>
            </div>
            <div>
                <div class="count" style="color:#FDD835" id="stat-renegades">0</div>
                <div>Отщеп.</div>
            </div>
        </div>

        <div id="game-players" class="grid"></div>

        <div class="bottom-bar">
            <button class="btn btn-secondary" onclick="resetGame()">🔄 Сброс</button>
            <button class="btn btn-danger" onclick="newGame()">🆕 Новая игра</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: Выбор роли -->
    <div id="modal-role" class="modal">
        <div class="modal-header">
            <span class="modal-title">Выбор роли: <strong id="modal-player-name"></strong></span>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>

        <div class="section">
            <div class="section-title">
                <span class="dot-citizen"></span>
                <strong>Горожане</strong>
            </div>
            <div id="roles-citizens" class="grid grid-3"></div>
        </div>

        <div class="section">
            <div class="section-title">
                <span class="dot-criminal"></span>
                <strong>Преступники</strong>
            </div>
            <div id="roles-criminals" class="grid grid-3"></div>
        </div>

        <div class="section">
            <div class="section-title">
                <span class="dot-renegade"></span>
                <strong>Отщепенцы</strong>
            </div>
            <div id="roles-renegades" class="grid grid-3"></div>
        </div>

        <div class="player-actions">
            <button class="btn btn-danger" onclick="toggleEliminated()">💀 Выбыл</button>
            <button class="btn btn-secondary" onclick="clearRole()">❌ Убрать роль</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 📋 СПИСОК ИГРОКОВ - ЛЕГКО РЕДАКТИРОВАТЬ!
        // ==========================================
        const PLAYERS = [
            "Димон", "Вова", "Вадим", "Катя", "Влад", "Рома", "Маша", "Инна", "Рябчун", "Виталик", "Стас", "Мотвей", "Надя", "Полина", "Соня", "Оля", "Лена", "Тёма"
        ];
        // ==========================================

        // Роли с эмодзи
        const ROLES = {
            citizens: [
                { id: "civilian", name: "Мирный", emoji: "👤" },
                { id: "agent", name: "Агент", emoji: "🕵️" },
                { id: "judge", name: "Судья", emoji: "⚖️" },
                { id: "detective", name: "Детектив", emoji: "🔍" },
                { id: "journalist", name: "Журналист", emoji: "📰" },
                { id: "doctor", name: "Доктор", emoji: "💉" },
                { id: "bodyguard", name: "Телохран.", emoji: "🛡️" },
                { id: "patrol", name: "Патрульный", emoji: "👮" },
                { id: "psychic", name: "Экстрасенс", emoji: "🔮" },
                { id: "fan", name: "Поклонница", emoji: "💕" },
                { id: "sleuth", name: "Сыщик", emoji: "🔎" },
                { id: "lucky", name: "Везунчик", emoji: "🍀" },
                { id: "avenger", name: "Мститель", emoji: "⚔️" }
            ],
            criminals: [
                { id: "mafia", name: "Мафия", emoji: "🔫" },
                { id: "cartel", name: "Картель", emoji: "💀" },
                { id: "lawyer", name: "Адвокат", emoji: "📜" },
                { id: "mistress", name: "Любовница", emoji: "💋" },
                { id: "hound", name: "Ищейка", emoji: "🐕" },
                { id: "werewolf", name: "Оборотень", emoji: "🐺" },
                { id: "boss", name: "Босс", emoji: "👔" },
                { id: "leader", name: "Главарь", emoji: "🎩" }
            ],
            renegades: [
                { id: "maniac", name: "Маньяк", emoji: "🔪" },
                { id: "poisoner", name: "Отравитель", emoji: "☠️" },
                { id: "cultist", name: "Сектант", emoji: "🕯️" },
                { id: "revolutionary", name: "Революц.", emoji: "✊" }
            ]
        };

        // Состояние игры
        let selectedPlayers = new Set();
        let gamePlayers = {}; // { name: { role: null, eliminated: false } }
        let currentEditPlayer = null;

        // Инициализация
        function init() {
            renderPlayersList();
            renderRolesModal();
        }

        // Отрисовка списка игроков для выбора
        function renderPlayersList() {
            const container = document.getElementById('players-list');
            container.innerHTML = PLAYERS.map(name => `
                <div class="player-select" onclick="togglePlayer('${name}')" id="select-${name}">
                    ${name}
                </div>
            `).join('');
        }

        // Выбор/снятие игрока
        function togglePlayer(name) {
            if (selectedPlayers.has(name)) {
                selectedPlayers.delete(name);
            } else {
                selectedPlayers.add(name);
            }
            document.getElementById(`select-${name}`).classList.toggle('selected');
        }

        // Начать игру
        function startGame() {
            if (selectedPlayers.size < 4) {
                alert('Выбери минимум 4 игрока!');
                return;
            }

            gamePlayers = {};
            selectedPlayers.forEach(name => {
                gamePlayers[name] = { role: null, eliminated: false };
            });

            document.getElementById('screen-select').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            renderGamePlayers();
        }

        // Отрисовка игроков в игре
        function renderGamePlayers() {
            const container = document.getElementById('game-players');
            container.innerHTML = Object.entries(gamePlayers).map(([name, data]) => {
                const role = findRole(data.role);
                let roleHtml = '<span class="role unset">Нажми для роли</span>';
                
                if (role) {
                    const colorClass = getRoleColorClass(data.role);
                    roleHtml = `<span class="role ${colorClass}">${role.emoji} ${role.name}</span>`;
                }

                return `
                    <div class="player-card ${data.eliminated ? 'eliminated' : ''}" 
                         onclick="openRoleModal('${name}')">
                        <div class="name">${name}</div>
                        ${roleHtml}
                    </div>
                `;
            }).join('');

            updateStats();
        }

        // Найти роль по id
        function findRole(roleId) {
            if (!roleId) return null;
            for (const category of Object.values(ROLES)) {
                const found = category.find(r => r.id === roleId);
                if (found) return found;
            }
            return null;
        }

        // Получить класс цвета роли
        function getRoleColorClass(roleId) {
            if (!roleId) return '';
            if (ROLES.citizens.find(r => r.id === roleId)) return 'role-citizen';
            if (ROLES.criminals.find(r => r.id === roleId)) return 'role-criminal';
            if (ROLES.renegades.find(r => r.id === roleId)) return 'role-renegade';
            return '';
        }

        // Отрисовка ролей в модальном окне
        function renderRolesModal() {
            document.getElementById('roles-citizens').innerHTML = 
                ROLES.citizens.map(r => createRoleBtn(r, 'citizen')).join('');
            document.getElementById('roles-criminals').innerHTML = 
                ROLES.criminals.map(r => createRoleBtn(r, 'criminal')).join('');
            document.getElementById('roles-renegades').innerHTML = 
                ROLES.renegades.map(r => createRoleBtn(r, 'renegade')).join('');
        }

        function createRoleBtn(role, type) {
            return `
                <div class="role-btn ${type}" onclick="selectRole('${role.id}')">
                    <span class="emoji">${role.emoji}</span>
                    ${role.name}
                </div>
            `;
        }

        // Открыть модальное окно выбора роли
        function openRoleModal(playerName) {
            currentEditPlayer = playerName;
            document.getElementById('modal-player-name').textContent = playerName;
            document.getElementById('modal-role').classList.add('active');
        }

        // Закрыть модальное окно
        function closeModal() {
            document.getElementById('modal-role').classList.remove('active');
            currentEditPlayer = null;
        }

        // Выбрать роль
        function selectRole(roleId) {
            if (currentEditPlayer && gamePlayers[currentEditPlayer]) {
                gamePlayers[currentEditPlayer].role = roleId;
                renderGamePlayers();
                closeModal();
            }
        }

        // Убрать роль
        function clearRole() {
            if (currentEditPlayer && gamePlayers[currentEditPlayer]) {
                gamePlayers[currentEditPlayer].role = null;
                renderGamePlayers();
                closeModal();
            }
        }

        // Переключить статус выбывшего
        function toggleEliminated() {
            if (currentEditPlayer && gamePlayers[currentEditPlayer]) {
                gamePlayers[currentEditPlayer].eliminated = !gamePlayers[currentEditPlayer].eliminated;
                renderGamePlayers();
                closeModal();
            }
        }

        // Обновить статистику
        function updateStats() {
            let alive = 0, citizens = 0, criminals = 0, renegades = 0;

            Object.values(gamePlayers).forEach(data => {
                if (!data.eliminated) {
                    alive++;
                    if (data.role) {
                        if (ROLES.citizens.find(r => r.id === data.role)) citizens++;
                        else if (ROLES.criminals.find(r => r.id === data.role)) criminals++;
                        else if (ROLES.renegades.find(r => r.id === data.role)) renegades++;
                    }
                }
            });

            document.getElementById('stat-alive').textContent = alive;
            document.getElementById('stat-citizens').textContent = citizens;
            document.getElementById('stat-criminals').textContent = criminals;
            document.getElementById('stat-renegades').textContent = renegades;
        }

        // Сбросить роли и статусы
        function resetGame() {
            if (confirm('Сбросить все роли и статусы?')) {
                Object.keys(gamePlayers).forEach(name => {
                    gamePlayers[name] = { role: null, eliminated: false };
                });
                renderGamePlayers();
            }
        }

        // Новая игра
        function newGame() {
            if (confirm('Начать новую игру?')) {
                selectedPlayers.clear();
                gamePlayers = {};
                document.querySelectorAll('.player-select').forEach(el => {
                    el.classList.remove('selected');
                });
                document.getElementById('screen-game').classList.add('hidden');
                document.getElementById('screen-select').classList.remove('hidden');
            }
        }

        // Запуск
        init();
    </script>
</body>
</html>
