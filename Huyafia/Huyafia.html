<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Мафия: Большой Город</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a1a; color: #e0e0e0; min-height: 100vh; overflow-x: hidden; }
:root { --blue: #1E88E5; --red: #E53935; --yellow: #FDD835; --bg-dark: #1a1a1a; --bg-card: #2a2a2a; --bg-hover: #333; --border: #444; }

/* Header */
.header { background: linear-gradient(135deg, #2d1010, #1a1a1a); border-bottom: 2px solid var(--red); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header h1 { font-size: 18px; color: var(--red); text-transform: uppercase; letter-spacing: 2px; }
.header-btn { background: var(--red); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
.header-btn:active { transform: scale(0.95); }
.header-btn.secondary { background: #444; }

/* Screens */
.screen { display: none; padding: 12px; padding-bottom: 80px; }
.screen.active { display: block; }

/* Player Selection Screen */
.section-title { font-size: 15px; color: #999; text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 8px; padding-left: 4px; }

.players-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.player-check { display: flex; align-items: center; background: var(--bg-card); border: 2px solid transparent; border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: all 0.15s; }
.player-check.checked { border-color: var(--red); background: #3a2020; }
.player-check input { display: none; }
.player-check .checkmark { width: 22px; height: 22px; border: 2px solid #555; border-radius: 6px; margin-right: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 14px; }
.player-check.checked .checkmark { background: var(--red); border-color: var(--red); }
.player-check .pname { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.select-all-bar { display: flex; gap: 8px; margin-bottom: 10px; }
.select-all-bar button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
.btn-all { background: #333; color: #e0e0e0; }
.btn-none { background: #333; color: #e0e0e0; }
.btn-start { background: var(--red); color: white; font-size: 15px; padding: 14px; margin-top: 16px; width: 100%; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; letter-spacing: 1px; }
.btn-start:active { transform: scale(0.97); }

/* Game Screen */
.game-tabs { display: flex; gap: 6px; margin-bottom: 12px; position: sticky; top: 56px; background: var(--bg-dark); padding: 8px 0; z-index: 50; }
.game-tab { flex: 1; padding: 10px 8px; border: none; border-radius: 8px; background: #333; color: #aaa; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; }
.game-tab.active { background: var(--red); color: white; }

/* Players in game */
.game-players { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.game-player { background: var(--bg-card); border-radius: 10px; padding: 10px; display: flex; align-items: center; gap: 8px; position: relative; cursor: pointer; border: 2px solid transparent; transition: all 0.15s; min-height: 52px; }
.game-player:active { background: var(--bg-hover); }
.game-player.eliminated { opacity: 0.5; order: 999; }
.game-player .elim-btn { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #555; background: none; color: #555; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.game-player.eliminated .elim-btn { border-color: var(--red); background: rgba(229,57,53,0.3); color: var(--red); }
.game-player .gp-info { flex: 1; min-width: 0; }
.game-player .gp-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.game-player .gp-role { font-size: 11px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.game-player .gp-name.town { color: var(--blue); }
.game-player .gp-name.crime { color: var(--red); }
.game-player .gp-name.rogue { color: var(--yellow); }
.game-player .gp-role.town { color: var(--blue); }
.game-player .gp-role.crime { color: var(--red); }
.game-player .gp-role.rogue { color: var(--yellow); }

.elim-cross { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.elim-cross span { font-size: 40px; color: rgba(229,57,53,0.5); font-weight: 900; }

/* Role Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: flex-end; }
.modal-overlay.open { display: flex; }
.modal-content { background: #222; border-radius: 20px 20px 0 0; width: 100%; max-height: 85vh; overflow-y: auto; padding: 16px; padding-bottom: 30px; animation: slideUp 0.2s; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.modal-header h2 { font-size: 16px; color: #e0e0e0; }
.modal-close { background: #444; border: none; color: white; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal-section { margin-bottom: 12px; }
.modal-section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; padding-left: 4px; }
.modal-section h3.town { color: var(--blue); }
.modal-section h3.crime { color: var(--red); }
.modal-section h3.rogue { color: var(--yellow); }
.roles-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 5px; }
.role-btn { padding: 10px 4px; border: 2px solid #444; border-radius: 8px; background: var(--bg-card); color: #e0e0e0; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; line-height: 1.2; }
.role-btn:active { transform: scale(0.95); }
.role-btn.town { border-color: rgba(30,136,229,0.4); }
.role-btn.town:active, .role-btn.town.selected { background: rgba(30,136,229,0.2); border-color: var(--blue); }
.role-btn.crime { border-color: rgba(229,57,53,0.4); }
.role-btn.crime:active, .role-btn.crime.selected { background: rgba(229,57,53,0.2); border-color: var(--red); }
.role-btn.rogue { border-color: rgba(253,216,53,0.4); }
.role-btn.rogue:active, .role-btn.rogue.selected { background: rgba(253,216,53,0.2); border-color: var(--yellow); }
.role-btn .remoji { font-size: 16px; display: block; margin-bottom: 2px; }
.btn-clear-role { background: #444; color: #e0e0e0; border: none; padding: 10px; border-radius: 8px; width: 100%; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 8px; }

/* Turn Order */
.turn-order { display: flex; flex-direction: column; gap: 6px; }
.turn-item { background: var(--bg-card); border-radius: 10px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.turn-num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex-shrink: 0; }
.turn-num.town { background: rgba(30,136,229,0.2); color: var(--blue); }
.turn-num.crime { background: rgba(229,57,53,0.2); color: var(--red); }
.turn-num.rogue { background: rgba(253,216,53,0.2); color: var(--yellow); }
.turn-info { flex: 1; min-width: 0; }
.turn-role { font-size: 13px; font-weight: 700; }
.turn-role.town { color: var(--blue); }
.turn-role.crime { color: var(--red); }
.turn-role.rogue { color: var(--yellow); }
.turn-player { font-size: 12px; color: #999; }

/* Restore bar */
.restore-bar { display: none; background: #2a3a2a; border: 1px solid #4a4; border-radius: 10px; padding: 10px; margin-bottom: 10px; }
.restore-bar.visible { display: block; }
.restore-bar h3 { font-size: 12px; color: #6a6; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
.restore-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
.restore-btn { background: #333; border: 1px solid #4a4; color: #e0e0e0; padding: 8px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }

/* Bottom nav */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #222; border-top: 2px solid #333; display: flex; z-index: 100; }
.bottom-nav.hidden { display: none; }
.nav-btn { flex: 1; padding: 12px 8px; border: none; background: none; color: #777; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; }
.nav-btn.active { color: var(--red); }
.nav-btn .nav-icon { font-size: 20px; display: block; margin-bottom: 2px; }

/* Player count */
.player-count { text-align: center; padding: 8px; font-size: 13px; color: #888; }

/* Stats bar */
.stats-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px; }
.stat-card { background: var(--bg-card); border-radius: 10px; padding: 10px; text-align: center; }
.stat-card .stat-num { font-size: 22px; font-weight: 800; }
.stat-card .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #888; }
.stat-card.town .stat-num { color: var(--blue); }
.stat-card.crime .stat-num { color: var(--red); }
.stat-card.rogue .stat-num { color: var(--yellow); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header" id="header">
  <h1>🔫 Мафия</h1>
  <div id="headerBtns">
    <button class="header-btn" id="newGameBtn" onclick="showScreen('setup')">Новая игра</button>
  </div>
</div>

<!-- SETUP SCREEN -->
<div class="screen active" id="setupScreen">
  <div class="section-title">Выберите игроков</div>
  <div class="select-all-bar">
    <button class="btn-all" onclick="selectAll()">✅ Все</button>
    <button class="btn-none" onclick="selectNone()">❌ Никого</button>
  </div>
  <div class="players-grid" id="playersGrid"></div>
  <div class="player-count" id="playerCount"></div>
  <button class="btn-start" id="startBtn" onclick="startGame()">🎮 НАЧАТЬ ИГРУ</button>
</div>

<!-- GAME SCREEN -->
<div class="screen" id="gameScreen">
  <div class="game-tabs">
    <button class="game-tab active" data-tab="players" onclick="switchTab('players')">👥 Игроки</button>
    <button class="game-tab" data-tab="turns" onclick="switchTab('turns')">🌙 Очередь</button>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-card town"><div class="stat-num" id="statTown">0</div><div class="stat-label">Город</div></div>
    <div class="stat-card crime"><div class="stat-num" id="statCrime">0</div><div class="stat-label">Преступ.</div></div>
    <div class="stat-card rogue"><div class="stat-num" id="statRogue">0</div><div class="stat-label">Отщеп.</div></div>
  </div>

  <!-- Players Tab -->
  <div id="playersTab">
    <div class="game-players" id="gamePlayers"></div>
  </div>

  <!-- Turns Tab -->
  <div id="turnsTab" style="display:none;">
    <div class="section-title">Очередь ходов (живые)</div>
    <div class="turn-order" id="turnOrder"></div>
  </div>
</div>

<!-- Role Selection Modal -->
<div class="modal-overlay" id="roleModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="roleModalTitle">Выбрать роль</h2>
      <button class="modal-close" onclick="closeRoleModal()">✕</button>
    </div>

    <div class="modal-section">
      <h3 class="town">🏘 Горожане</h3>
      <div class="roles-grid" id="townRoles"></div>
    </div>

    <div class="modal-section">
      <h3 class="crime">🔪 Преступники</h3>
      <div class="roles-grid" id="crimeRoles"></div>
    </div>

    <div class="modal-section">
      <h3 class="rogue">⚡ Отщепенцы</h3>
      <div class="roles-grid" id="rogueRoles"></div>
    </div>

    <button class="btn-clear-role" onclick="clearRole()">🚫 Убрать роль</button>
  </div>
</div>

<script>
// ============================================================
// 📋 СПИСОК ИГРОКОВ - РЕДАКТИРУЙ ЗДЕСЬ!
// Просто добавляй или удаляй имена в этом массиве:
// ============================================================
const ALL_PLAYERS = [
  "Димон", "Вова", "Вадим", "Катя", "Влад", "Рома", "Маша", "Инна", "Рябчун", "Виталик", "Стас", "Мотвей", "Надя", "Полина", "Соня", "Оля", "Лена", "Тёма"
];
// ============================================================

// Roles data
const ROLES = {
  town: [
    { id: 'civilian', name: 'Мирный житель', emoji: '🧑', order: 99 },
    { id: 'agent', name: 'Агент', emoji: '🕵️', order: 98 },
    { id: 'judge', name: 'Судья', emoji: '⚖️', order: 13 },
    { id: 'detective', name: 'Детектив', emoji: '🔍', order: 8 },
    { id: 'journalist', name: 'Журналист', emoji: '📰', order: 9 },
    { id: 'doctor', name: 'Доктор', emoji: '💊', order: 2 },
    { id: 'bodyguard', name: 'Телохранитель', emoji: '🛡️', order: 3 },
    { id: 'patrol', name: 'Патрульный', emoji: '🚔', order: 8 },
    { id: 'psychic', name: 'Экстрасенс', emoji: '🔮', order: 10 },
    { id: 'fangirl', name: 'Поклонница', emoji: '💋', order: 14 },
    { id: 'sleuth', name: 'Сыщик', emoji: '🧐', order: 12 },
    { id: 'lucky', name: 'Везунчик', emoji: '🍀', order: 97 },
    { id: 'avenger', name: 'Мститель', emoji: '💀', order: 96 },
  ],
  crime: [
    { id: 'mafia', name: 'Мафия', emoji: '🔫', order: 4 },
    { id: 'cartel', name: 'Картель', emoji: '💣', order: 5 },
    { id: 'lawyer', name: 'Адвокат', emoji: '📋', order: 1 },
    { id: 'mistress', name: 'Любовница', emoji: '💃', order: 7 },
    { id: 'hound', name: 'Ищейка', emoji: '🐕', order: 11 },
    { id: 'werewolf', name: 'Оборотень', emoji: '🐺', order: 95 },
    { id: 'boss', name: 'Босс', emoji: '👑', order: 94 },
    { id: 'leader', name: 'Главарь', emoji: '🎩', order: 93 },
  ],
  rogue: [
    { id: 'maniac', name: 'Маньяк', emoji: '🪓', order: 6 },
    { id: 'poisoner', name: 'Отравитель', emoji: '☠️', order: 6 },
    { id: 'cultist', name: 'Сектант', emoji: '🕯️', order: 6 },
    { id: 'revolutionary', name: 'Революционер', emoji: '✊', order: 6 },
  ]
};

// Flatten for lookup
const ALL_ROLES = {};
const ROLE_FACTION = {};
for (const [faction, roles] of Object.entries(ROLES)) {
  for (const r of roles) {
    ALL_ROLES[r.id] = r;
    ROLE_FACTION[r.id] = faction;
  }
}

// Game state
let gamePlayers = []; // { name, role: null|roleId, eliminated: false }
let currentModalPlayer = null;

// Init
function init() {
  renderPlayersList();
}

function renderPlayersList() {
  const grid = document.getElementById('playersGrid');
  grid.innerHTML = '';
  ALL_PLAYERS.forEach((name, i) => {
    const div = document.createElement('div');
    div.className = 'player-check';
    div.dataset.index = i;
    div.innerHTML = `<input type="checkbox" id="pc${i}"><div class="checkmark"></div><div class="pname">${name}</div>`;
    div.onclick = () => {
      const cb = div.querySelector('input');
      cb.checked = !cb.checked;
      div.classList.toggle('checked', cb.checked);
      if (cb.checked) div.querySelector('.checkmark').innerHTML = '✓'; else div.querySelector('.checkmark').innerHTML = '';
      updateCount();
    };
    grid.appendChild(div);
  });
  updateCount();
}

function updateCount() {
  const checked = document.querySelectorAll('.player-check.checked').length;
  document.getElementById('playerCount').textContent = `Выбрано: ${checked} игроков`;
  document.getElementById('startBtn').disabled = checked < 2;
}

function selectAll() {
  document.querySelectorAll('.player-check').forEach(d => {
    d.classList.add('checked');
    d.querySelector('input').checked = true;
    d.querySelector('.checkmark').innerHTML = '✓';
  });
  updateCount();
}

function selectNone() {
  document.querySelectorAll('.player-check').forEach(d => {
    d.classList.remove('checked');
    d.querySelector('input').checked = false;
    d.querySelector('.checkmark').innerHTML = '';
  });
  updateCount();
}

function startGame() {
  const checked = document.querySelectorAll('.player-check.checked');
  if (checked.length < 2) return;
  gamePlayers = [];
  checked.forEach(d => {
    const idx = parseInt(d.dataset.index);
    gamePlayers.push({ name: ALL_PLAYERS[idx], role: null, eliminated: false });
  });
  showScreen('game');
  renderGame();
}

function showScreen(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  if (screen === 'setup') {
    document.getElementById('setupScreen').classList.add('active');
    document.getElementById('newGameBtn').style.display = 'none';
  } else {
    document.getElementById('gameScreen').classList.add('active');
    document.getElementById('newGameBtn').style.display = '';
    document.getElementById('newGameBtn').onclick = () => {
      if (confirm('Начать новую игру? Текущая будет потеряна.')) {
        showScreen('setup');
      }
    };
  }
}

function getFactionClass(roleId) {
  if (!roleId) return '';
  return ROLE_FACTION[roleId] || '';
}

function renderGame() {
  renderGamePlayers();
  renderTurnOrder();
  updateStats();
}

function renderGamePlayers() {
  const container = document.getElementById('gamePlayers');
  // Sort: alive first, then eliminated
  const sorted = [...gamePlayers].sort((a, b) => {
    if (a.eliminated && !b.eliminated) return 1;
    if (!a.eliminated && b.eliminated) return -1;
    return 0;
  });

  container.innerHTML = '';
  sorted.forEach((p) => {
    const originalIndex = gamePlayers.indexOf(p);
    const faction = getFactionClass(p.role);
    const role = p.role ? ALL_ROLES[p.role] : null;
    const div = document.createElement('div');
    div.className = 'game-player' + (p.eliminated ? ' eliminated' : '');
    div.innerHTML = `
      <button class="elim-btn" onclick="event.stopPropagation();toggleEliminate(${originalIndex})">${p.eliminated ? '↩' : '✕'}</button>
      <div class="gp-info" onclick="openRoleModal(${originalIndex})">
        <div class="gp-name ${faction}">${p.name}</div>
        <div class="gp-role ${faction}">${role ? role.emoji + ' ' + role.name : '❓ Не назначена'}</div>
      </div>
      ${p.eliminated ? '<div class="elim-cross"><span>✕</span></div>' : ''}
    `;
    container.appendChild(div);
  });
}

function toggleEliminate(idx) {
  gamePlayers[idx].eliminated = !gamePlayers[idx].eliminated;
  renderGame();
}

function updateStats() {
  let town = 0, crime = 0, rogue = 0;
  gamePlayers.forEach(p => {
    if (p.eliminated) return;
    const f = getFactionClass(p.role);
    if (f === 'town') town++;
    else if (f === 'crime') crime++;
    else if (f === 'rogue') rogue++;
  });
  document.getElementById('statTown').textContent = town;
  document.getElementById('statCrime').textContent = crime;
  document.getElementById('statRogue').textContent = rogue;
}

// Role Modal
function openRoleModal(idx) {
  currentModalPlayer = idx;
  const p = gamePlayers[idx];
  document.getElementById('roleModalTitle').textContent = `Роль: ${p.name}`;

  renderRoleButtons('townRoles', ROLES.town, 'town', p.role);
  renderRoleButtons('crimeRoles', ROLES.crime, 'crime', p.role);
  renderRoleButtons('rogueRoles', ROLES.rogue, 'rogue', p.role);

  document.getElementById('roleModal').classList.add('open');
}

function renderRoleButtons(containerId, roles, faction, currentRole) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  roles.forEach(r => {
    const btn = document.createElement('button');
    btn.className = `role-btn ${faction}` + (currentRole === r.id ? ' selected' : '');
    btn.innerHTML = `<span class="remoji">${r.emoji}</span>${r.name}`;
    btn.onclick = () => selectRole(r.id);
    container.appendChild(btn);
  });
}

function selectRole(roleId) {
  if (currentModalPlayer !== null) {
    gamePlayers[currentModalPlayer].role = roleId;
  }
  closeRoleModal();
  renderGame();
}

function clearRole() {
  if (currentModalPlayer !== null) {
    gamePlayers[currentModalPlayer].role = null;
  }
  closeRoleModal();
  renderGame();
}

function closeRoleModal() {
  document.getElementById('roleModal').classList.remove('open');
  currentModalPlayer = null;
}

// Turn order
const TURN_ORDER_SEQUENCE = [
  'lawyer', 'doctor', 'bodyguard', 'mafia', 'cartel',
  'maniac', 'poisoner', 'revolutionary', 'cultist',
  'mistress', 'detective', 'patrol', 'journalist',
  'psychic', 'hound', 'sleuth', 'judge', 'fangirl'
];

function renderTurnOrder() {
  const container = document.getElementById('turnOrder');
  container.innerHTML = '';

  // Get alive players with roles that are in the turn order
  const entries = [];
  TURN_ORDER_SEQUENCE.forEach((roleId, i) => {
    const players = gamePlayers.filter(p => !p.eliminated && p.role === roleId);
    players.forEach(p => {
      const role = ALL_ROLES[roleId];
      const faction = ROLE_FACTION[roleId];
      entries.push({ order: i + 1, role, faction, playerName: p.name });
    });
  });

  if (entries.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:#666;padding:30px;">Нет активных ролей с ночными действиями</div>';
    return;
  }

  entries.forEach(e => {
    const div = document.createElement('div');
    div.className = 'turn-item';
    div.innerHTML = `
      <div class="turn-num ${e.faction}">${e.order}</div>
      <div class="turn-info">
        <div class="turn-role ${e.faction}">${e.role.emoji} ${e.role.name}</div>
        <div class="turn-player">${e.playerName}</div>
      </div>
    `;
    container.appendChild(div);
  });
}

// Tabs
function switchTab(tab) {
  document.querySelectorAll('.game-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('playersTab').style.display = tab === 'players' ? '' : 'none';
  document.getElementById('turnsTab').style.display = tab === 'turns' ? '' : 'none';
  document.getElementById('statsBar').style.display = tab === 'players' ? '' : 'none';
}

// Close modal on overlay click
document.getElementById('roleModal').addEventListener('click', function(e) {
  if (e.target === this) closeRoleModal();
});

// Init
init();
</script>
</body>
</html>
