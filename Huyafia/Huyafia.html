<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Мафия — Помощник Ведущего</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #1a1a1e;
    --bg2: #252528;
    --bg3: #2f2f34;
    --bg4: #3a3a40;
    --text: #e0e0e0;
    --text2: #999;
    --red: #E53935;
    --blue: #1E88E5;
    --yellow: #FDD835;
    --accent: #c62828;
    --accent2: #b71c1c;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding-bottom: 80px;
  }

  header {
    background: linear-gradient(135deg, #1a1a1e 0%, #2d1515 100%);
    padding: 16px;
    text-align: center;
    border-bottom: 2px solid var(--accent);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-size: 20px;
    color: var(--red);
    letter-spacing: 1px;
  }

  header .subtitle {
    font-size: 12px;
    color: var(--text2);
    margin-top: 2px;
  }

  .screen { display: none; padding: 12px; }
  .screen.active { display: block; }

  /* ===== BUTTONS ===== */
  .btn {
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: linear-gradient(135deg, var(--red), var(--accent2));
    width: 100%;
    padding: 14px;
    font-size: 16px;
  }

  .btn-secondary {
    background: var(--bg3);
    color: var(--text);
  }

  .btn-sm {
    padding: 6px 12px;
    font-size: 13px;
    border-radius: 8px;
  }

  .btn-danger { background: var(--red); }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--bg4);
    color: var(--text2);
  }

  /* ===== PLAYER SELECT SCREEN ===== */
  .players-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 12px 0;
  }

  .player-check {
    background: var(--bg2);
    border: 2px solid var(--bg4);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }

  .player-check.checked {
    border-color: var(--red);
    background: #2d1515;
  }

  .player-check .ck {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid var(--bg4);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    transition: all 0.15s;
  }

  .player-check.checked .ck {
    background: var(--red);
    border-color: var(--red);
  }

  .player-check .pname {
    font-size: 14px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ===== GAME SCREEN ===== */
  .game-players-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin: 10px 0;
  }

  .gp-card {
    background: var(--bg2);
    border: 2px solid var(--bg3);
    border-radius: 10px;
    padding: 10px;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
  }

  .gp-card.eliminated {
    opacity: 0.5;
    order: 999;
  }

  .gp-card .gp-name {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .gp-card .gp-role {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 8px;
    height: 18px;
  }

  .gp-card .gp-actions {
    display: flex;
    gap: 4px;
  }

  .gp-card .gp-actions .btn-sm {
    flex: 1;
    font-size: 11px;
    padding: 5px 4px;
  }

  .gp-card .elim-x {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(229, 57, 53, 0.15);
    pointer-events: none;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    color: rgba(229, 57, 53, 0.6);
  }

  .gp-card.eliminated .elim-x { display: flex; }

  /* ===== ROLE PICKER MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--bg2);
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 16px;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal h3 {
    text-align: center;
    margin-bottom: 12px;
    color: var(--text);
    font-size: 16px;
  }

  .modal .role-section-title {
    font-size: 13px;
    font-weight: 700;
    padding: 8px 4px 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .modal .role-section-title.blue { color: var(--blue); }
  .modal .role-section-title.red { color: var(--red); }
  .modal .role-section-title.yellow { color: var(--yellow); }

  .roles-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 8px;
  }

  .role-btn {
    background: var(--bg3);
    border: 2px solid var(--bg4);
    border-radius: 10px;
    padding: 10px 8px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }

  .role-btn:active { transform: scale(0.96); }
  .role-btn .role-emoji { font-size: 20px; display: block; margin-bottom: 2px; }
  .role-btn .role-order { font-size: 10px; color: var(--text2); }

  .role-btn.blue-r { border-color: rgba(30,136,229,0.3); }
  .role-btn.blue-r:active { background: rgba(30,136,229,0.15); }
  .role-btn.red-r { border-color: rgba(229,57,53,0.3); }
  .role-btn.red-r:active { background: rgba(229,57,53,0.15); }
  .role-btn.yellow-r { border-color: rgba(253,216,53,0.3); }
  .role-btn.yellow-r:active { background: rgba(253,216,53,0.15); }

  .clear-role-btn {
    background: var(--bg4);
    border: none;
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    text-align: center;
    font-size: 13px;
    color: var(--text2);
    grid-column: 1 / -1;
  }

  /* ===== NAV ===== */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg2);
    border-top: 2px solid var(--bg3);
    display: flex;
    z-index: 100;
    display: none;
  }

  .bottom-bar.visible { display: flex; }

  .bottom-bar .tab {
    flex: 1;
    padding: 10px 4px;
    text-align: center;
    font-size: 11px;
    color: var(--text2);
    cursor: pointer;
    border: none;
    background: none;
    transition: color 0.15s;
  }

  .bottom-bar .tab.active { color: var(--red); }
  .bottom-bar .tab .tab-icon { font-size: 20px; display: block; }

  /* ===== MISC ===== */
  .select-all-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .select-all-bar .btn { flex: 1; }

  .counter {
    text-align: center;
    color: var(--text2);
    font-size: 13px;
    margin: 8px 0;
  }

  .section-title {
    font-size: 14px;
    color: var(--text2);
    margin: 16px 0 8px;
    padding-left: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .color-blue { color: var(--blue) !important; }
  .color-red { color: var(--red) !important; }
  .color-yellow { color: var(--yellow) !important; }

  .game-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .game-header-bar h2 { font-size: 16px; }

  .new-game-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }

  .stats-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .stat-chip {
    background: var(--bg3);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
  }

  .divider {
    height: 1px;
    background: var(--bg4);
    margin: 12px 0;
  }

  /* sort helper */
  .gp-card { order: 0; }
</style>
</head>
<body>

<header>
  <h1>🔫 МАФИЯ: БОЛЬШОЙ ГОРОД</h1>
  <div class="subtitle">Помощник ведущего</div>
</header>

<!-- ==================== SCREEN 1: PLAYER SELECT ==================== -->
<div id="screenSelect" class="screen active">
  <div class="section-title">Выбери игроков для новой игры</div>

  <div class="select-all-bar">
    <button class="btn btn-secondary btn-sm" onclick="selectAll()">✅ Все</button>
    <button class="btn btn-ghost btn-sm" onclick="selectNone()">❌ Никого</button>
  </div>

  <div class="counter" id="selCounter">Выбрано: 0</div>

  <div class="players-grid" id="playersList"></div>

  <div style="height:12px"></div>

  <button class="btn btn-primary" id="startGameBtn" onclick="startGame()">🎮 НАЧАТЬ ИГРУ</button>
</div>

<!-- ==================== SCREEN 2: GAME ==================== -->
<div id="screenGame" class="screen">
  <div class="game-header-bar">
    <h2>🎲 Игра</h2>
    <button class="new-game-btn" onclick="endGame()">🔄 Новая игра</button>
  </div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="game-players-grid" id="gamePlayers"></div>
</div>

<!-- ==================== ROLE PICKER MODAL ==================== -->
<div class="modal-overlay" id="roleModal">
  <div class="modal">
    <h3 id="roleModalTitle">Выбери роль</h3>
    <div id="roleModalContent"></div>
    <div style="height:12px"></div>
    <button class="btn btn-ghost" style="width:100%" onclick="closeRoleModal()">Отмена</button>
    <div style="height:12px"></div>
  </div>
</div>

<script>
// ============================================================
//  👥 СПИСОК ИГРОКОВ — РЕДАКТИРУЙ ЗДЕСЬ
//  Просто добавляй / удаляй строки:
// ============================================================
const ALL_PLAYERS = [
  "Алиса",
  "Борис",
  "Вика",
  "Глеб",
  "Даша",
  "Егор",
  "Жанна",
  "Захар",
  "Инна",
  "Кирилл",
  "Лена",
  "Макс",
  "Нина",
  "Олег",
  "Полина",
  "Роман",
  "Света",
  "Тимур",
];
// ============================================================

// Roles definition
// team: 'town', 'crime', 'rogue'
// order: night action order (0 = no night action)
const ROLES = [
  // Горожане
  { id: 'civilian',     name: 'Мирный житель',emoji: '🧑',    team: 'town',  order: 0 },
  { id: 'agent',        name: 'Агент',        emoji: '🕵️',   team: 'town',  order: 0 },
  { id: 'judge',        name: 'Судья',        emoji: '⚖️',   team: 'town',  order: 13 },
  { id: 'detective',    name: 'Детектив',     emoji: '🔍',    team: 'town',  order: 8 },
  { id: 'journalist',   name: 'Журналист',    emoji: '📰',    team: 'town',  order: 9 },
  { id: 'doctor',       name: 'Доктор',       emoji: '💊',    team: 'town',  order: 2 },
  { id: 'bodyguard',    name: 'Телохранитель',emoji: '🛡️',   team: 'town',  order: 3 },
  { id: 'patrol',       name: 'Патрульный',   emoji: '🚔',    team: 'town',  order: 8 },
  { id: 'psychic',      name: 'Экстрасенс',  emoji: '🔮',    team: 'town',  order: 10 },
  { id: 'fangirl',      name: 'Поклонница',   emoji: '💋',    team: 'town',  order: 14 },
  { id: 'sleuth',       name: 'Сыщик',        emoji: '🧐',    team: 'town',  order: 12 },
  { id: 'lucky',        name: 'Везунчик',     emoji: '🍀',    team: 'town',  order: 0 },
  { id: 'avenger',      name: 'Мститель',     emoji: '⚔️',   team: 'town',  order: 0 },

  // Преступники
  { id: 'mafia',        name: 'Мафия',        emoji: '🔫',    team: 'crime', order: 4 },
  { id: 'cartel',       name: 'Картель',      emoji: '💀',    team: 'crime', order: 5 },
  { id: 'lawyer',       name: 'Адвокат',      emoji: '📜',    team: 'crime', order: 1 },
  { id: 'mistress',     name: 'Любовница',    emoji: '❤️‍🔥', team: 'crime', order: 7 },
  { id: 'hound',        name: 'Ищейка',       emoji: '🐕',    team: 'crime', order: 11 },
  { id: 'werewolf',     name: 'Оборотень',    emoji: '🐺',    team: 'crime', order: 0 },
  { id: 'boss',         name: 'Босс',         emoji: '👔',    team: 'crime', order: 4 },
  { id: 'kingpin',      name: 'Главарь',      emoji: '🎩',    team: 'crime', order: 4 },

  // Отщепенцы
  { id: 'maniac',       name: 'Маньяк',       emoji: '🔪',    team: 'rogue', order: 6 },
  { id: 'poisoner',     name: 'Отравитель',   emoji: '☠️',   team: 'rogue', order: 6 },
  { id: 'cultist',      name: 'Сектант',      emoji: '🕯️',  team: 'rogue', order: 6 },
  { id: 'revolutionary',name: 'Революционер', emoji: '✊',    team: 'rogue', order: 6 },
];

const TEAM_COLORS = {
  town:  { class: 'color-blue',   label: 'Горожане',    section: 'blue',   btnClass: 'blue-r' },
  crime: { class: 'color-red',    label: 'Преступники', section: 'red',    btnClass: 'red-r' },
  rogue: { class: 'color-yellow', label: 'Отщепенцы',   section: 'yellow', btnClass: 'yellow-r' },
};

// State
let selected = new Set();
let gameState = null; // { players: [ { name, role, eliminated } ] }
let rolePickTarget = null;

// ============ SCREEN: PLAYER SELECT ============
function renderPlayersList() {
  const cont = document.getElementById('playersList');
  cont.innerHTML = '';
  ALL_PLAYERS.forEach(name => {
    const div = document.createElement('div');
    div.className = 'player-check' + (selected.has(name) ? ' checked' : '');
    div.innerHTML = `<div class="ck">${selected.has(name) ? '✓' : ''}</div><div class="pname">${name}</div>`;
    div.addEventListener('click', () => {
      if (selected.has(name)) selected.delete(name); else selected.add(name);
      renderPlayersList();
    });
    cont.appendChild(div);
  });
  document.getElementById('selCounter').textContent = `Выбрано: ${selected.size}`;
  document.getElementById('startGameBtn').disabled = selected.size === 0;
}

function selectAll() {
  ALL_PLAYERS.forEach(n => selected.add(n));
  renderPlayersList();
}

function selectNone() {
  selected.clear();
  renderPlayersList();
}

// ============ START GAME ============
function startGame() {
  if (selected.size === 0) return;
  gameState = {
    players: Array.from(selected).map(name => ({ name, role: null, eliminated: false }))
  };
  showScreen('screenGame');
  renderGame();
}

function endGame() {
  if (!confirm('Завершить текущую игру?')) return;
  gameState = null;
  showScreen('screenSelect');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ============ RENDER GAME ============
function renderGame() {
  if (!gameState) return;
  const cont = document.getElementById('gamePlayers');
  cont.innerHTML = '';

  // Stats
  const alive = gameState.players.filter(p => !p.eliminated);
  const towns = alive.filter(p => p.role && getRoleDef(p.role)?.team === 'town').length;
  const crimes = alive.filter(p => p.role && getRoleDef(p.role)?.team === 'crime').length;
  const rogues = alive.filter(p => p.role && getRoleDef(p.role)?.team === 'rogue').length;
  const unknown = alive.filter(p => !p.role).length;

  document.getElementById('statsBar').innerHTML =
    `<div class="stat-chip">👥 Живых: ${alive.length}/${gameState.players.length}</div>` +
    `<div class="stat-chip color-blue">🏘 ${towns}</div>` +
    `<div class="stat-chip color-red">🔫 ${crimes}</div>` +
    `<div class="stat-chip color-yellow">🎭 ${rogues}</div>` +
    (unknown > 0 ? `<div class="stat-chip">❓ ${unknown}</div>` : '');

  // Sort: alive first, then eliminated
  const sorted = [...gameState.players].sort((a, b) => {
    if (a.eliminated !== b.eliminated) return a.eliminated ? 1 : -1;
    return 0;
  });

  sorted.forEach((p, _) => {
    const idx = gameState.players.indexOf(p);
    const roleDef = p.role ? getRoleDef(p.role) : null;
    const teamInfo = roleDef ? TEAM_COLORS[roleDef.team] : null;
    const nameColorClass = teamInfo ? teamInfo.class : '';
    const roleColorClass = teamInfo ? teamInfo.class : '';

    const card = document.createElement('div');
    card.className = 'gp-card' + (p.eliminated ? ' eliminated' : '');
    card.innerHTML = `
      <div class="gp-name ${nameColorClass}">${p.name}</div>
      <div class="gp-role ${roleColorClass}">${roleDef ? roleDef.emoji + ' ' + roleDef.name : '—'}</div>
      <div class="gp-actions">
        ${p.eliminated
          ? `<button class="btn btn-sm btn-secondary" onclick="revivePlayer(${idx})">↩️</button>`
          : `<button class="btn btn-sm btn-secondary" onclick="openRoleModal(${idx})">🎭</button>
             <button class="btn btn-sm btn-danger" onclick="eliminatePlayer(${idx})">☠️</button>`
        }
      </div>
      <div class="elim-x">✕</div>
    `;
    cont.appendChild(card);
  });
}

function getRoleDef(roleId) {
  return ROLES.find(r => r.id === roleId) || null;
}

function eliminatePlayer(idx) {
  gameState.players[idx].eliminated = true;
  renderGame();
}

function revivePlayer(idx) {
  gameState.players[idx].eliminated = false;
  renderGame();
}

// ============ ROLE MODAL ============
function openRoleModal(idx) {
  rolePickTarget = idx;
  const p = gameState.players[idx];
  document.getElementById('roleModalTitle').textContent = `Роль: ${p.name}`;

  const content = document.getElementById('roleModalContent');
  content.innerHTML = '';

  // Build sections
  const teams = ['town', 'crime', 'rogue'];
  teams.forEach(team => {
    const info = TEAM_COLORS[team];
    const title = document.createElement('div');
    title.className = `role-section-title ${info.section}`;
    title.textContent = info.label;
    content.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'roles-grid';

    ROLES.filter(r => r.team === team).forEach(role => {
      const btn = document.createElement('div');
      btn.className = `role-btn ${info.btnClass}`;
      btn.innerHTML = `
        <span class="role-emoji">${role.emoji}</span>
        ${role.name}
        ${role.order > 0 ? `<div class="role-order">Ход #${role.order}</div>` : '<div class="role-order">—</div>'}
      `;
      btn.addEventListener('click', () => {
        assignRole(role.id);
      });
      grid.appendChild(btn);
    });

    content.appendChild(grid);
  });

  // Clear role button
  const clearBtn = document.createElement('div');
  clearBtn.className = 'clear-role-btn';
  clearBtn.textContent = '🚫 Убрать роль';
  clearBtn.addEventListener('click', () => {
    gameState.players[rolePickTarget].role = null;
    closeRoleModal();
    renderGame();
  });
  content.appendChild(clearBtn);

  document.getElementById('roleModal').classList.add('open');
}

function assignRole(roleId) {
  if (rolePickTarget !== null) {
    gameState.players[rolePickTarget].role = roleId;
  }
  closeRoleModal();
  renderGame();
}

function closeRoleModal() {
  document.getElementById('roleModal').classList.remove('open');
  rolePickTarget = null;
}

// Close modal on overlay click
document.getElementById('roleModal').addEventListener('click', function(e) {
  if (e.target === this) closeRoleModal();
});

// ============ INIT ============
renderPlayersList();
</script>
</body>
</html>
